<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>AI Coder Course — Exam Portal</title>
  <style>
    :root {
      --bg: #f3eee6;
      --bg-elev: #fffdf8;
      --ink: #1c1916;
      --muted: #5e574e;
      --line: #e2d6c4;
      --accent: #0f4c4f;
      --accent-soft: #dcecea;
      --warm: #c45c26;
      --good: #1e6b46;
      --good-bg: #e7f4ec;
      --bad: #a33b32;
      --bad-bg: #f8e8e6;
      --shadow: 0 18px 40px rgba(28, 25, 22, 0.08);
      --radius: 18px;
      --font: "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --bg-elev: #1e1b18;
        --ink: #f4ece3;
        --muted: #b7aea1;
        --line: #3a342c;
        --accent: #8ed4cc;
        --accent-soft: #243836;
        --warm: #e59a6c;
        --good: #8fd4ad;
        --good-bg: #1b3328;
        --bad: #ef8f88;
        --bad-bg: #3a2422;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(1200px 500px at 10% -10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 55%),
        var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    button, .opt {
      font-family: inherit;
    }
    .wrap {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 80px;
    }
    header.appbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .brand strong { font-size: 1.05rem; letter-spacing: -0.02em; }
    .brand span { color: var(--muted); font-size: 0.86rem; }
    .ghost, .primary, .secondary {
      border-radius: 999px;
      border: 1px solid transparent;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .primary {
      background: var(--accent);
      color: var(--bg-elev);
    }
    @media (prefers-color-scheme: dark) {
      .primary { color: #102322; }
    }
    .secondary {
      background: var(--bg-elev);
      color: var(--ink);
      border-color: var(--line);
    }
    .ghost:hover, .secondary:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
    .primary:hover { filter: brightness(1.05); }
    .primary:disabled, .secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.04em; line-height: 1.15; margin: 0 0 10px; }
    .lede { color: var(--muted); font-size: 1.05rem; max-width: 62ch; margin: 0 0 28px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .exam-card {
      text-align: left;
      padding: 22px;
      cursor: pointer;
      width: 100%;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 180px;
    }
    .exam-card:hover, .exam-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .exam-card .kicker {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .exam-card h2 { margin: 0; font-size: 1.2rem; letter-spacing: -0.03em; }
    .exam-card p { margin: 0; color: var(--muted); flex: 1; }
    .meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
    .pill {
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-weight: 650;
    }
    .howto {
      margin-top: 28px;
      padding: 20px 22px;
    }
    .howto h3 { margin: 0 0 8px; font-size: 1rem; }
    .howto ul { margin: 0; padding-left: 18px; color: var(--muted); }
    .howto li { margin: 6px 0; }
    .progress-wrap { margin: 8px 0 22px; }
    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .bar {
      height: 8px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 240ms ease;
    }
    .q-card { padding: 26px; }
    .q-text {
      font-size: 1.22rem;
      letter-spacing: -0.03em;
      line-height: 1.35;
      margin: 0 0 18px;
    }
    .options { display: grid; gap: 10px; }
    .opt {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      color: inherit;
      font-size: 1rem;
    }
    .opt:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .opt .key {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 0.85rem;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      flex-shrink: 0;
    }
    .opt.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .opt.correct { background: var(--good-bg); border-color: var(--good); }
    .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
    .opt.dim { opacity: 0.55; }
    .opt:disabled { cursor: default; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      align-items: center;
    }
    .hint {
      margin-top: 14px;
      padding: 12px 14px;
      border-left: 3px solid var(--warm);
      color: var(--muted);
      background: color-mix(in srgb, var(--warm) 8%, var(--bg-elev));
      border-radius: 0 12px 12px 0;
    }
    .feedback {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid var(--line);
    }
    .feedback.ok { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
    .feedback.no { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
    .feedback h3 { margin: 0 0 8px; font-size: 1rem; }
    .feedback p { margin: 0 0 10px; }
    .source {
      font-size: 0.88rem;
      color: var(--muted);
    }
    .kbd {
      font-size: 0.78rem;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 6px;
      color: var(--muted);
    }
    .scorebox {
      display: grid;
      gap: 8px;
      justify-items: center;
      text-align: center;
      padding: 36px 24px 20px;
    }
    .big {
      font-size: clamp(3rem, 8vw, 5rem);
      letter-spacing: -0.06em;
      font-weight: 750;
      line-height: 1;
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 16px; }
    .filters button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--bg-elev);
      border-color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      .filters button[aria-pressed="true"] { color: #102322; }
    }
    .review {
      display: grid;
      gap: 12px;
    }
    .review article {
      padding: 16px 18px;
    }
    .review .q { font-weight: 650; margin-bottom: 8px; }
    .tag { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }
    .tag.ok { background: var(--good-bg); color: var(--good); }
    .tag.no { background: var(--bad-bg); color: var(--bad); }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    .error {
      padding: 20px;
      border: 1px solid var(--bad);
      background: var(--bad-bg);
      border-radius: var(--radius);
    }
    @media (prefers-reduced-motion: reduce) {
      .bar > span { transition: none; }
    }
  </style>
</head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>
  <div class="wrap">
    <header class="appbar">
      <div class="brand">
        <strong>AI Coder Course</strong>
        <span>Exam portal</span>
      </div>
      <button class="ghost hidden" id="homeBtn" type="button">All exams</button>
    </header>
    <main id="main"></main>
  </div>

  <script type="application/json" id="quiz-fallback">{"title":"AI Coder Course — Exam Portal","subtitle":"Week 1–3 quizzes from the lecture subtitles and descriptions. Multiple choice only.","instructorNote":"Questions are drawn only from what the course actually taught. Options are meant to be close — not guessable by length or jargon.","sections":{"week1":{"id":"week1","title":"Week 1 — Vibe Coding","blurb":"IDEs, LLMs, agents.md, YOLO vs Ralph, and a commercial-style MVP.","questionCount":20,"questions":[{"id":"w1-01","topic":"Agent definition","question":"According to the late-2025 consensus definition taught in the course, what is an AI agent?","options":["An LLM that runs tools in a loop to achieve a goal","A chatbot given a long system prompt and a memory store","Any system that can browse the web without a human present","An LLM whose tokens orchestrate future model calls as a workflow"],"correct":"An LLM that runs tools in a loop to achieve a goal","hint":"The definition that “planted the flag” names three ingredients, not just independence.","explanation":"Correct: Simon Willison’s late-2025 consensus, which the course treats as current, is that an AI agent is an LLM that runs tools in a loop to achieve a goal. Wrong: a long system prompt plus memory is still just an application around a model, not that definition. Wrong: early OpenAI-style “works independently” (for example a browser agent booking things) is an older, narrower framing. Wrong: “an LLM controls the workflow” is the earlier Hugging Face / Anthropic Building Effective Agents wording, which the course presents as prior, not the winning 2025 flag.","source":"Week 1, Day 2 — Tools, Loops, and the Definition of AI Agents"},{"id":"w1-02","topic":"Illusion of memory","question":"Why can a chat product appear to remember your name later in the same thread?","options":["The app resends the whole conversation on every new model call","The model writes your identity into its weights after the first turn","A separate memory network sits beside the language model and is queried","Only the latest user message is sent, plus a hidden user-profile token"],"correct":"The app resends the whole conversation on every new model call","hint":"Every raw model call is stateless; the “memory” has to live in the input.","explanation":"Correct: each LLM call is stateless. Chat products create an illusion of memory by resending the entire conversation so far. Wrong: the model does not update its weights from your chat. Wrong: there is not a second neural net inside the LLM that stores you. Wrong: sending only the latest message (even with a magic profile token) is exactly what would make “Who am I?” fail on a raw call.","source":"Week 1, Day 2 — How LLMs Work / Context Engineering"},{"id":"w1-03","topic":"Tokens and inference","question":"At each generation step, what does an LLM actually emit?","options":["A probability distribution over possible next tokens","The single most likely next word, with no alternatives scored","A complete paragraph assembled internally in one internal shot","A database lookup of the closest matching training document"],"correct":"A probability distribution over possible next tokens","hint":"The unit is not “the next word,” and generation is not one-shot.","explanation":"Correct: the model outputs a probability distribution over every possible next token (often a word, often part of a word). Inference then samples/chooses, appends that token, and feeds the growing sequence back in. Wrong: it is not limited to a single unscored word. Wrong: it does not write a full paragraph in one internal step. Wrong: it is a statistical pattern matcher, not a document lookup.","source":"Week 1, Day 2 — How LLMs Work: Tokens, Memory, and Reasoning"},{"id":"w1-04","topic":"Tool execution","question":"When a coding agent “uses Python” or “searches the web,” who actually runs that action?","options":["Surrounding software interprets special tokens and executes the tool","The transformer runs the interpreter or browser inside its own layers","The model simply rewords the final answer; no extra runtime is involved","A second model trained only on tool APIs executes the call by itself"],"correct":"Surrounding software interprets special tokens and executes the tool","hint":"The neural net never leaves token-land; something around it has to act.","explanation":"Correct: the LLM only emits tokens. If the prompt allows special outputs (Python, search, and so on), surrounding software interprets them, runs the tool, and calls the model again with the result. Wrong: the transformer does not browse or execute Python in its layers. Wrong: tool use is not just nicer wording of the answer. Wrong: a second specialist model is not what the course taught as the execution path.","source":"Week 1, Day 2 — Tools, Loops, and the Definition of AI Agents"},{"id":"w1-05","topic":"Vibe coding","question":"What did Karpathy originally mean by “vibe coding”?","options":["Fully giving in to the vibes and forgetting that the code even exists","Using autocomplete while still reading and approving every single diff","Writing a precise spec first, then letting an agent execute it in phases","Pair-programming while you type the production code and the model comments"],"correct":"Fully giving in to the vibes and forgetting that the code even exists","hint":"The original tweet is about an attitude toward the code, not a workflow brand.","explanation":"Correct: Karpathy coined vibe coding as fully giving in to the vibes, embracing the exponentials, and forgetting that the code even exists — possible because LLMs were getting too good. Wrong: reading every diff is the opposite of that original stance. Wrong: spec-then-execute is closer to 2025 structured / spec-driven work. Wrong: you typing production code is ordinary pair programming, not the original vibe-coding claim.","source":"Week 1, Day 1 — Vibe Coding, Agentic Coders & Coding Agents"},{"id":"w1-06","topic":"Agentic coder vs coding agent","question":"In this course’s terminology, what is an “agentic coder”?","options":["A person who uses agents to help them write software","A person whose job is to implement agent frameworks from scratch","A platform such as Cursor or Claude Code that writes the code","An amateur who ships prompts without ever looking at the output"],"correct":"A person who uses agents to help them write software","hint":"The course warns that the same phrase is used two different ways in the industry.","explanation":"Correct: on this course, “agentic coder” means someone using agents to help them code. Wrong: other people use the same phrase for people building agents — that is not this course’s meaning. Wrong: Cursor and Claude Code are coding agents (platforms), not “agentic coders.” Wrong: shipping blindly is closer to irresponsible vibe coding, not the course definition of agentic coder.","source":"Week 1, Day 1 — Vibe Coding, Agentic Coders & Coding Agents"},{"id":"w1-07","topic":"Yegge stages","question":"In Steve Yegge’s eight stages, what is the conceptual shift at stage 4?","options":["The agent occupies the main window and attention moves off the code","You enable YOLO so the sidebar agent can accept every tool call","You leave the IDE entirely and work only through a terminal CLI","A master orchestrator starts managing other manager and worker agents"],"correct":"The agent occupies the main window and attention moves off the code","hint":"YOLO in the sidebar is earlier; the CLI and orchestrators are later stages.","explanation":"Correct: stage 4 is the shift where the agent occupies the main window, diffs fly by, and your attention is on the agent rather than the code — you may even walk away. Wrong: YOLO while still in the IDE sidebar is stage 3. Wrong: CLI agents are stage 5. Wrong: a master/orchestrator agent is stage 8.","source":"Week 1, Day 1 — The 8 Stages of AI Coding"},{"id":"w1-08","topic":"Enterprise sweet spot","question":"Where did the instructor place the sweet spot for quality, reliable, scalable software?","options":["Between stages 5 and 6 — CLI agents, not full orchestration","At stage 8 — a master agent managing manager and worker teams","At stages 2 and 3 — sidebar agents that still ask permission","At stage 1 — ChatGPT and autocomplete used as a side reference"],"correct":"Between stages 5 and 6 — CLI agents, not full orchestration","hint":"More sophisticated on the ladder is not the same as “best for enterprise.”","explanation":"Correct: more sophisticated is not automatically better for enterprise. The taught sweet spot is between stages 5 and 6 (CLI, maybe a few concurrent agents). Stages 7–8 are shown; whether you would use them in enterprise “today” is left open. Wrong: stage 8 is not the recommended enterprise default. Wrong: stages 2–3 are Week 1 IDE territory, not the quality/scale sweet spot. Wrong: stage 1 is explicitly not where Week 1 even starts.","source":"Week 1, Day 1 — The 8 Stages of AI Coding"},{"id":"w1-09","topic":"Context windows","question":"Which taught context-window sizes match GPT 5.2, Claude Sonnet/Opus 4.5, and Gemini as presented?","options":["About 400K, 200K, and 1M tokens respectively","About 200K, 400K, and 1M tokens respectively","About 1M, 200K, and 400K tokens respectively","About 128K, 128K, and 200K tokens respectively"],"correct":"About 400K, 200K, and 1M tokens respectively","hint":"Headline maxima still degrade in quality before you hit the hard cap.","explanation":"Correct: taught maxima were GPT 5.2 ≈ 400K, Claude Sonnet/Opus 4.5 ≈ 200K, Gemini (Antigravity) ≈ 1M. Quality degrades before the hard limit; best performance is near the start of a window. Wrong: 200K then 400K swaps GPT and Claude. Wrong: putting 1M on GPT is backwards. Wrong: 128K figures are not the numbers taught for these models.","source":"Week 1, Day 2 — Context Engineering"},{"id":"w1-10","topic":"agents.md hierarchy","question":"When nested agents.md files conflict, which rule did the course teach?","options":["The inner file for the subtree being worked on overrides the outer one","The root agents.md always wins over any subdirectory file","Every nested agents.md loads at session start and is merged equally","Nested files load only if you @-mention them in the user prompt"],"correct":"The inner file for the subtree being worked on overrides the outer one","hint":"Not every nested file is always in context — only the path the agent is in.","explanation":"Correct: root agents.md is always in context. Nested agents.md files load only when the agent works in that subtree (walking inward, then parents). Inner overrides outer. Wrong: outer does not beat inner. Wrong: nested files are not all loaded at once. Wrong: you do not have to @-mention them for the hierarchy to apply. Related names: Claude Code uses claude.md; Antigravity uses gemini.md / .agent rules — same idea.","source":"Week 1, Day 2 — Mastering agents.md"},{"id":"w1-11","topic":"Writing agents.md","question":"What writing style did the course recommend for an agents.md file?","options":["Concise positive instructions, with success criteria as a checklist","Long lists of “never” and “don’t” rules to block every past failure","A friendly README packed with emojis so the agent stays cooperative","As many tokens as the window allows, so nothing important is omitted"],"correct":"Concise positive instructions, with success criteria as a checklist","hint":"Those tokens are precious, and models handle some instruction shapes better than others.","explanation":"Correct: keep it concise, assertive, high-signal. Include project goals and success criteria as a checklist. Prefer what to do over long “never/don’t” lists — models handle positives more coherently. IMPORTANT in caps and backticks help; short READMEs; no emojis. Wrong: piles of negatives are the discouraged style. Wrong: emoji READMEs are treated as slop. Wrong: filling the window hurts quality; less is more.","source":"Week 1, Day 2 — Mastering agents.md"},{"id":"w1-12","topic":"Ralph Loops","question":"How does a Ralph Loop differ from ordinary YOLO agent mode?","options":["It wraps the inner tool loop in an outer self-feedback loop that can run overnight","It is simply YOLO with a longer timeout and no extra evaluation step","A human types new feedback at the start of each of about ten cycles","It replaces the inner tool loop with a single one-shot completion"],"correct":"It wraps the inner tool loop in an outer self-feedback loop that can run overnight","hint":"YOLO is roughly dinner-length; this pattern is a category of long-running self-feedback.","explanation":"Correct: coined by Geoffrey Huntley (Ralph Wiggum). An agent already loops tools to a goal; Ralph wraps that in an outer loop: run → evaluate → generate its own feedback / update objectives → run again, up to ~10 big cycles. YOLO ≈ an hour / dinner; Ralph ≈ hours / overnight. Wrong: it is not just a longer YOLO timeout. Wrong: the human does not type each cycle’s feedback (the FPS demo was one-shot). Wrong: the inner tool loop still exists.","source":"Week 1, Day 2 — Evolution of AI Coding Workflows: YOLO to Ralph Loops"},{"id":"w1-13","topic":"Choosing a workflow","question":"For which work did the course recommend a structured 2025-style process instead of Ralph loops?","options":["Mission-critical systems, large repos, and novel libraries with little training data","Greenfield boilerplate React, HTML, and CRUD prototypes with higher risk appetite","Overnight MVP experiments in an empty directory you can throw away","Toy games where a one-shot prompt is enough to get a playable result"],"correct":"Mission-critical systems, large repos, and novel libraries with little training data","hint":"Match the workflow to the job — including work the models have barely seen.","explanation":"Correct: structured plan/review/spec-driven work is for mission-critical enterprise, commercial SaaS, large codebases, and highly innovative work (the MCP-server example: models lack training data and write non-idiomatic code). Wrong: boilerplate greenfield, throwaway MVPs, and toy games are exactly where YOLO / Ralph / swarms were treated as reasonable. You remain accountable either way.","source":"Week 1, Day 2 — Evolution of AI Coding Workflows"},{"id":"w1-14","topic":"IDE vs plugin vs CLI","question":"How did the course position GitHub Copilot relative to Cursor?","options":["Copilot is typically a VS Code extension; Cursor is a VS Code fork","Copilot is a VS Code fork; Cursor is only a plugin on real VS Code","Both are CLI-first tools that happen to offer a sidebar as a backup","Copilot is Google’s fork of VS Code, while Cursor is Microsoft’s IDE"],"correct":"Copilot is typically a VS Code extension; Cursor is a VS Code fork","hint":"The taxonomy is IDEs vs plugins vs CLIs — not “which chat panel looks nicer.”","explanation":"Correct: three surfaces were taught. IDEs (Cursor / Codex app / Antigravity / Windsurf) have windows and panes; Cursor is an Anysphere fork of VS Code. Plugins: GitHub Copilot as a VS Code extension is the common Copilot path. CLIs: Claude Code popularized the retro terminal. Wrong: those fork/plugin roles are reversed. Wrong: Copilot is not CLI-first in this taxonomy. Wrong: Google’s fork is Antigravity, not Copilot.","source":"Week 1, Day 1 & Day 4 — Surfaces and choosing an LLM"},{"id":"w1-15","topic":"Antigravity rules","question":"Where do Antigravity’s persistent agent rules live, as taught?","options":["In .agent/Rules files such as strategy.md, not a root agents.md","In a root agents.md, loaded the same way Cursor and Copilot load it","In claude.md, because Antigravity shares Claude Code’s memory file","Only in Cursor-style rules files that have fully replaced agents.md"],"correct":"In .agent/Rules files such as strategy.md, not a root agents.md","hint":"Same idea as agents.md, different filename and folder — easy to mix up in a comparison.","explanation":"Correct: Antigravity (Google’s VS Code fork) used .agent/Rules/strategy.md, with activation modes such as always on. Wrong: it does not use root agents.md the way Cursor/Copilot/Codex do. Wrong: claude.md is Claude Code. Wrong: Cursor still converges on agents.md; rules files were not taught as having replaced it. The Kanban ranking also warned not to compare IDEs without comparing models.","source":"Week 1, Day 3 — Antigravity IDE and Gemini 3 Pro"},{"id":"w1-16","topic":"Be the Boss","question":"Under the “Be the Boss” principles, what three things should a concise agents.md cover?","options":["What to build (the spec), the style, and measurable success","The model name, the API key location, and whether YOLO is enabled","A full architecture, every future epic, and an 80% coverage quota","Team bios, a marketing README, and a list of banned libraries"],"correct":"What to build (the spec), the style, and measurable success","hint":"The first principle is an investment in one short file — not a giant spec dump.","explanation":"Correct: invest in a concise agents.md covering the spec, style, and measurable success. Other principles: start simple (the whole first file is an MVP), work incrementally, don’t get lazy after early wins, and manage frustration/downsides. Wrong: model/key/YOLO are session choices, not that file’s job. Wrong: boiling the ocean and an 80% quota were later shown as traps. Wrong: bios and emoji READMEs are slop, not the spec.","source":"Week 1, Day 4 — Five Principles for Successful Vibe Coding"},{"id":"w1-17","topic":"Learning vs AI assistance","question":"In the Anthropic-cited comparison of juniors with vs without AI assistants, what happened on a quiz about the underlying library?","options":["The AI group scored about 50% and the no-AI group about 67%","The AI group scored about 67% and the no-AI group about 50%","Both groups scored about the same, with a large speed win for the AI group","The AI group scored near 90%, showing assistants improve conceptual learning"],"correct":"The AI group scored about 50% and the no-AI group about 67%","hint":"The lecture’s point was a learning cost, not a claim that assistants make you smarter.","explanation":"Correct: on a quiz about the underlying library, the AI-assisted group scored ~50% and the no-AI group ~67%. Small productivity gain on that task, significant learning hit. Keep learning while using agents. Wrong: swapping the scores reverses the finding. Wrong: they did not score the same. Wrong: assistants were not shown to improve that quiz performance.","source":"Week 1, Day 4 — Responsible YOLO Coding / OpenRouter"},{"id":"w1-18","topic":"OpenRouter","question":"What problem does OpenRouter solve as taught in the course?","options":["One account and key can reach many providers instead of separate vendor keys","It is itself a frontier LLM that replaces GPT, Claude, and Gemini","Free endpoints keep full privacy by default and never train on your prompts","It stores your .env in the cloud so you never paste an API key locally"],"correct":"One account and key can reach many providers instead of separate vendor keys","hint":"It is a gateway in the middle — and the free path has an explicit privacy tradeoff.","explanation":"Correct: openrouter.ai sits in the middle so you don’t need separate OpenAI/Anthropic/Google accounts. One key (must match exactly, including the sk-or-v1- prefix). Wrong: it is not an LLM. Wrong: for free models you enable privacy settings that may train on inputs and may publish prompts — not “full privacy by default.” Wrong: keys still live in local .env (and .gitignore), not in OpenRouter’s vault as a substitute for .env.","source":"Week 1, Day 4 — Setting Up OpenRouter for AI Projects"},{"id":"w1-19","topic":"Docker","question":"How did the course map Dockerfile, image, and container?","options":["Recipe, snapshot/blueprint, and the live isolated environment","Live process, recipe file, and the cloud registry that stores it","Virtual machine, hypervisor, and the guest operating system kernel","Compose file, Kubernetes pod, and the running production service"],"correct":"Recipe, snapshot/blueprint, and the live isolated environment","hint":"Agents care about this because isolation and portability change how safely they can run.","explanation":"Correct: Dockerfile = recipe; image = snapshot/blueprint built from it; container = live isolated environment from an image (one image can yield many containers). Docker is a lightweight “computer within your computer” vs VMs. Relevant to agentic work for isolation (harder to smash the host) and portability. Wrong: those three roles are scrambled. Wrong: containers are not full VMs. Wrong: Compose/K8s were not the three terms taught in Web Apps 101.","source":"Week 1, Day 5 — Web Apps 101: Front-End, Back-End, APIs & Docker"},{"id":"w1-20","topic":"Coverage theater","question":"What went wrong when the project rules demanded 80% unit-test coverage?","options":["The model followed the letter of the rule and ground out low-value tests","The model refused to write any tests until the coverage line was removed","Coverage above 80% made the agent skip integration tests automatically","The package manager refused to run the suite until coverage dropped below 80%"],"correct":"The model followed the letter of the rule and ground out low-value tests","hint":"Models often obey the metric you wrote, not the quality you meant.","explanation":"Correct: an 80% coverage target caused letter-of-the-law grinding on low-value tests; the agent did not push back. Re-steer: valuable tests beat hitting 80%; missing 80% is OK. Same “trust but verify” theme as skipped tests, pip instead of UV, and “I fixed it” without a repro. Wrong: it did not refuse tests. Wrong: coverage did not auto-skip integration tests as a taught mechanism. Wrong: UV/pip was a separate drift issue, not a coverage lockout.","source":"Week 1, Day 5 — Planning, scaffolding, and FastAPI Kanban"}]},"week2":{"id":"week2","title":"Week 2 — Vibe Engineering","blurb":"Claude Code CLI, MCP vs skills vs plugins, Jira-to-PR, and debugging.","questionCount":20,"questions":[{"id":"w2-01","topic":"Vibe engineering","question":"What gap does Simon Willison’s term “vibe engineering” fill?","options":["Seasoned professionals accelerating with LLMs while staying accountable for the software","A faster, looser version of vibe coding that ignores how the code actually works","Anthropic’s official name for Claude Code’s professional subscription tier","Karpathy’s name for forgetting that the code exists and shipping overnight loops"],"correct":"Seasoned professionals accelerating with LLMs while staying accountable for the software","hint":"The term is a contrast with “fast, loose, irresponsible” prompt-driven building.","explanation":"Correct: Willison coined vibe engineering for seasoned professionals who accelerate with LLMs while proudly staying accountable. Vibe coding, as he defined it here, is fast/loose/irresponsible with no attention to how the code works. Wrong: vibe engineering is not “vibe coding but quicker.” Wrong: it is not an Anthropic product name. Wrong: Karpathy’s original vibe coding is the opposite attitude, not this professional gap-filler.","source":"Week 2, Day 1 — Welcome to Pro Week: From Vibe Coding to Vibe Engineering"},{"id":"w2-02","topic":"Claude Code origin","question":"What was Claude Code originally, before it became a mature product?","options":["A late-2024 side project by Boris Cherny, first called Claude CLI","Anthropic’s VS Code fork, shipped as an IDE before any terminal existed","The Claude Code SDK, released first so people could build their own agents","A plugin marketplace that later grew a command-line interface around it"],"correct":"A late-2024 side project by Boris Cherny, first called Claude CLI","hint":"The origin story is a terminal agent loop, not an IDE that later grew a CLI.","explanation":"Correct: late 2024, Anthropic engineer Boris Cherny built a side project originally called Claude CLI. Generally available around February 2025, wider April 2025. September 2025 V2 matured checkpointing, subagents, hooks, skills, background tasks, and a Claude Code SDK. Wrong: it did not start as a VS Code fork. Wrong: the SDK drives the Claude Code ecosystem; it is not OpenAI Agents SDK and was not the first form. Wrong: marketplaces came later.","source":"Week 2, Day 1 — The Rise of Claude Code"},{"id":"w2-03","topic":"/init and claude.md","question":"What does Claude Code’s /init command produce, and what is the professional caveat?","options":["A drafted claude.md from the repo — but you should not rely on Claude writing its own","A required new agents.md that Claude Code always reads instead of claude.md","A compact of the current session so /init can be run at the start of every day","A permission rule that permanently enables bypass-permissions for the project"],"correct":"A drafted claude.md from the repo — but you should not rely on Claude writing its own","hint":"Claude Code’s memory file is not named the same as Cursor’s.","explanation":"Correct: Claude Code uses claude.md, not AGENTS.md. /init analyzes the repo and drafts claude.md. Best practice: do not rely on Claude writing its own; the human supervisor should write or heavily edit it. Wrong: it does not switch the product onto agents.md. Wrong: /init is not compaction and is not required every session. Wrong: it is not YOLO.","source":"Week 2, Day 1 — Getting Started with Claude Code CLI: Init, Context & Testing"},{"id":"w2-04","topic":"Context buffer","question":"In /context, what is the reserved buffer at the end of Claude Code’s window for?","options":["Wiggle room so the session can compact (compress memory) before it hard-fails","Unused waste that you should fill with extra MCP servers to use the quota","A copy of claude.md that is loaded twice so it cannot be forgotten","Space reserved exclusively for YOLO so dangerous commands have their own budget"],"correct":"Wiggle room so the session can compact (compress memory) before it hard-fails","hint":"Claude Code’s taught window size is 200K — and compaction is not lossless.","explanation":"Correct: Claude’s context is 200,000 tokens. /context shows memory (including claude.md), messages, free space, and an end buffer reserved so it can compact with wiggle room. Wrong: filling that buffer with extra MCP is the opposite of the advice. Wrong: claude.md is not duplicated into the buffer. Wrong: YOLO is a permission mode, not a token budget. Compacting mid-task was repeatedly warned against.","source":"Week 2, Day 1 — Init, Context & Testing"},{"id":"w2-05","topic":"Hallucinated git secrets","question":"A code-review agent “critically” says your OpenRouter key is in git and must be rotated. What failure mode was demonstrated?","options":["A highly confident false positive: .env was gitignored and not on GitHub","A true finding: if .env exists on disk it is always already in git history","A sub-agent bug that the parent is allowed to treat as a sufficient root cause","A compaction artifact that only happens after /clear, never during review"],"correct":"A highly confident false positive: .env was gitignored and not on GitHub","hint":"Confident, strongly worded security claims still have to be verified by a human.","explanation":"Correct: the review claimed rotate the key / remove .env from git history. False: .env was gitignored and not on GitHub. Classic LLM failure: highly confident, strongly worded. After pushback it admitted a sub-agent misread — and the instructor said don’t accept “the sub-agent got it wrong” as enough; it should have checked. The mistake can repeat after compact. Wrong: local .env ≠ in git. Wrong: blaming the sub-agent is not sufficient. Wrong: this was a review hallucination, not a /clear-only bug.","source":"Week 2, Day 1 — Claude Code Review: Fixing Hallucinations"},{"id":"w2-06","topic":"/compact vs /clear","question":"What is the difference between /compact and /clear in Claude Code?","options":["/compact keeps a summary of the chat; /clear wipes history back to config files","/clear keeps a summary of the chat; /compact deletes claude.md from disk","They are identical except /compact also enables bypass-permissions","/compact restores git; /clear restores the last named session’s files"],"correct":"/compact keeps a summary of the chat; /clear wipes history back to config files","hint":"One is a lossy summary; the other is a clean brain that re-reads your markdown.","explanation":"Correct: /compact summarizes/resets conversation history but keeps a summary (optional keep-instructions). /clear wipes history like a fresh `claude`, then it rereads config (claude.md). Prefer /compact yourself at task boundaries — not auto-compact mid-rewrite. After compact: often sharper, but lost discussion can repeat mistakes; put keep-forever facts in claude.md. Wrong: /clear does not keep a summary and does not delete claude.md. Wrong: neither flag is YOLO. Wrong: neither is git or session-file restore.","source":"Week 2, Day 2 — Commands, Shortcuts & Configuration"},{"id":"w2-07","topic":"Shift+Tab vs YOLO","question":"What does Shift+Tab actually toggle in Claude Code, compared with real YOLO?","options":["Accept-edits (and plan mode) — not the same as bypassing all permissions","Bypass-permissions YOLO, which is also what accept-edits always enables","Named session resume, which restores both conversation and the working tree","Ralph Loop install, which is the official way to turn on skip-permissions"],"correct":"Accept-edits (and plan mode) — not the same as bypassing all permissions","hint":"Auto-approving file diffs is a smaller switch than “do not ask before dangerous commands.”","explanation":"Correct: Shift+Tab cycles accept-edits on (auto-approve file diffs) and plan mode. With Opus, forcing plan mode is less necessary. Accept-edits is not YOLO. Real YOLO is `claude --dangerously-skip-permissions`, which will not ask before potentially dangerous commands — Anthropic’s warning says use a sandboxed container; you take responsibility. Wrong: those two modes are not the same. Wrong: Shift+Tab is not session resume. Wrong: Ralph is a plugin, not this shortcut.","source":"Week 2, Day 2 — Commands and YOLO Mode"},{"id":"w2-08","topic":"Sessions vs checkpoints vs git","question":"Sessions, checkpoints, and git all “go back.” What does resuming a session restore?","options":["The conversation and context state — not the files in the repo","A full disk image of every file, including script and sub-agent edits","Only the last git commit, because sessions are aliases for commits","Checkpoints of each prompt plus a guaranteed revert of all side effects"],"correct":"The conversation and context state — not the files in the repo","hint":"Three granularities: whole chat, per-prompt rewind, and real code history.","explanation":"Correct: sessions are whole conversation/context. Resume restores conversation, not repo/code. Checkpoints correspond to each prompt; rewind can restore conversation, code, or both — but only changes Claude knows it made. Git is the bulletproof long-term code snapshot. Wrong: there is no full disk image. Wrong: sessions are not git aliases. Wrong: rewind cannot undo independent script/sub-agent/human edits.","source":"Week 2, Day 2 — Sessions, Checkpoints & Git"},{"id":"w2-09","topic":"Rewind limits","question":"Which changes can checkpoint rewind not undo?","options":["Edits made independently by a script, a sub-agent, or you outside Claude’s log","Any file Claude itself edited in the current session, by definition","Conversation text only — rewind never touches files, so this case cannot arise","Git commits created during the session, which rewind always deletes"],"correct":"Edits made independently by a script, a sub-agent, or you outside Claude’s log","hint":"Rewind is not a VM snapshot; git remains the real safety net.","explanation":"Correct: rewind can only undo changes Claude knows it made. If a script or sub-agent changed files independently, or you changed files, those edits will not revert. Instructor workflow: git as primary safety net; checkpoints for immediate mistakes. Wrong: known Claude edits can be reverted (optionally with conversation). Wrong: rewind can restore code, not only chat. Wrong: rewind does not delete git commits.","source":"Week 2, Day 2 — Checkpoints, Rewind, and YOLO"},{"id":"w2-10","topic":"Ralph vs Feature Dev","question":"How do Ralph Loops and the Feature Dev plugin sit relative to each other?","options":["Ralph is an outer autonomy loop; Feature Dev is a regimented seven-stage rail","Feature Dev is Ralph with a nicer name and the same overnight chaos","Ralph is the official Anthropic internal process; Feature Dev is a toy loop","Both are Shift+Tab modes; Feature Dev is simply Ralph with accept-edits on"],"correct":"Ralph is an outer autonomy loop; Feature Dev is a regimented seven-stage rail","hint":"One is “let it iterate”; the other is “stay on rails and play a primary role.”","explanation":"Correct: Ralph (Huntley / Ralph Wiggum), installed as `ralph-loop@claude-plugins/official`, wraps an outer loop — great for prototypes/MVPs. Feature Dev is the polar opposite: Anthropic’s internal-style seven-stage feature workflow (explore, architecture, quality review, clarifying questions). Wrong: they are not the same product. Wrong: Feature Dev, not Ralph, is the official rails plugin. Wrong: neither is a Shift+Tab mode.","source":"Week 2, Day 2 & Day 4 — Ralph Loops and Feature Dev"},{"id":"w2-11","topic":"What MCP is","question":"What is MCP actually standardizing, in the “USB-C for AI” metaphor?","options":["A protocol for connecting AI apps to external systems — not the tools themselves","Anthropic’s model weights, so every host runs the same Claude checkpoint","The stock-price and docs tools that ship inside Claude Code by default","Prompt templates and resources, which the course said overtook tools in popularity"],"correct":"A protocol for connecting AI apps to external systems — not the tools themselves","hint":"The game-changer taught here is ecosystem adoption, not unique protocol magic.","explanation":"Correct: MCP (Model Context Protocol) is an open standard for connecting AI apps to external systems. Originally tools, prompt templates, and resources — tools took off. MCP is connectivity, not the tools themselves. Wrong: it is not model weights. Wrong: stock/docs servers are examples you add, not the protocol. Wrong: tools, not prompts/resources, were what took off. Cons: too many servers bloat context.","source":"Week 2, Day 3 — MCP, Skills & Plugins: The Big Three"},{"id":"w2-12","topic":"Local vs remote MCP","question":"A “local” MCP server for live stock prices runs on your machine. What did the course emphasize?","options":["Local vs remote is where the process runs — local servers can still call the internet","Local means the server is offline-only and cannot fetch live market data","Local MCP is not real MCP; only remote SSE servers get the USB-C benefits","Local always means you wrote the server; shared npx/UV packages do not count"],"correct":"Local vs remote is where the process runs — local servers can still call the internet","hint":"Polygon/Massive was the worked example of this confusion.","explanation":"Correct: local/remote refers to where the server process runs, not whether tools call the internet. Polygon ran locally but fetched live (or stale-free-tier) prices. Most MCP servers are local and still come from a shared repo (npx/UV/pip). Wrong: local ≠ offline. Wrong: local still gets MCP benefits. Wrong: you did not have to author it. Remote transports: SSE is legacy; streamable HTTP is the modern way.","source":"Week 2, Day 3 — MCP Servers: Hosts, Clients, and Discovery"},{"id":"w2-13","topic":"Skill progressive disclosure","question":"For installed skills, what is always loaded into context?","options":["Only each skill’s metadata (name and description), via progressive disclosure","Every skill’s full instructions, scripts, and extra docs, all the time","Nothing until you type the skill’s slash name exactly, including the plugin prefix","The entire skill.md body, but never the YAML header, to save tokens"],"correct":"Only each skill’s metadata (name and description), via progressive disclosure","hint":"Think of skills as extra claude.md files that load in layers, not all at once.","explanation":"Correct: three levels — (1) metadata name+description, always loaded; (2) instructions, if triggered; (3) resources/scripts only if needed. Scripts run via shell; processing stays out of context and only the result returns. Wrong: full files are not always loaded. Wrong: slash invocation helps but metadata is still always there. Wrong: the YAML header is the always-on part, not the part that is skipped.","source":"Week 2, Day 3 — Skills vs MCP"},{"id":"w2-14","topic":"Plugins first","question":"When MCP, skills, and plugins could all work, what is the default starting point taught?","options":["Start with plugins, unless you know you need a specific MCP or skill","Always configure MCP first because it is lower-level and therefore safer","Always write a standalone skill first, then wrap it in MCP for discovery","Install as many of all three as possible so the model has more options"],"correct":"Start with plugins, unless you know you need a specific MCP or skill","hint":"More extensions can confuse the model; auth-heavy tools are the usual MCP exception.","explanation":"Correct: start with plugins (bundles of MCPs, skills, slash commands, hooks, later agents). Use MCP directly for specialized tools with particular auth (GitHub, Jira, market data). Use standalone skills when repo-shared markdown/scripts are the point. Don’t overload plugins. Wrong: MCP-first is not the default. Wrong: skills-first then MCP is backwards of the framework. Wrong: more options cause routing confusion and context degradation.","source":"Week 2, Day 3 — MCP vs Skills vs Plugins: Choosing the Right Setup"},{"id":"w2-15","topic":"Jira and GitHub MCP","question":"Why were Jira and GitHub added as raw MCP servers rather than only as plugins?","options":["They are powerful tools with particular authorization, so MCP is the proper path","Plugins cannot wrap GitHub or Jira at all, even as a discovery convenience","MCP is required because skills cannot live in a repo that also uses git","The GitHub plugin uses a PAT in claude.md, which is safer than MCP headers"],"correct":"They are powerful tools with particular authorization, so MCP is the proper path","hint":"Skills were also taught as weaker on authorization than the MCP standard.","explanation":"Correct: famous, powerful, particular authorization — go through MCP. Atlassian: remote HTTP + OAuth 2; hangs often mean lost auth → /mcp and reauthenticate. GitHub: remote HTTP with Authorization header = fine-grained PAT (slim repo scopes). An official GitHub plugin exists but uses slightly different auth (env var); they still added MCP. Wrong: a GitHub plugin does exist. Wrong: skills/git can coexist. Wrong: PATs do not go in claude.md.","source":"Week 2, Day 4 — Jira MCP, GitHub MCP, and Feature Dev"},{"id":"w2-16","topic":"Debugging strategy","question":"What is the first action in the disciplined debugging strategy before a long agent tangent?","options":["Git commit a snapshot; do not trust rewind as your only restore point","Turn on bypass-permissions so the agent can apply fixes without stopping","Immediately /clear so the bug cannot pollute claude.md with extra tokens","Paste a request to “just fix it” and refuse to provide the stack trace"],"correct":"Git commit a snapshot; do not trust rewind as your only restore point","hint":"If the first paste-the-error loop fails, the next move is a markdown file with proof, not more YOLO.","explanation":"Correct: (1) git commit first — rewind misses side effects. (2) Small issues: paste the stack trace as-is, repeatedly. (3) If that fails: revert, then a regimented debug.md — reproduce, investigate, hypotheses, prove root cause, fix and prove it, write lessons into claude.md. (4) Red herring: restore, note what it is not, restart. Wrong: YOLO is not step one. Wrong: /clear before capturing lessons loses them. Wrong: “just fix it” without a repro is the failure mode.","source":"Week 2, Day 4 — Debugging Strategies for Claude Code"},{"id":"w2-17","topic":"Home vs project claude.md","question":"Why must the home-directory claude.md stay short?","options":["It is injected into every session, so every token is paid on every project","Claude Code ignores project claude.md unless the home file is under 20 lines","Home files cannot mention UV or style rules; those belong only in plugins","A long home file disables compaction, which is required for Max plans"],"correct":"It is injected into every session, so every token is paid on every project","hint":"There are two claude.md files with different jobs — global style vs this product.","explanation":"Correct: home claude.md is user-global, every project, every session. Keep it to pet peeves / extra nuggets (UV not pip, no emojis, prove root cause, short modules). Project claude.md is the human “boss” lever for this product (don’t duplicate Jira). Wrong: there is no 20-line ignore rule. Wrong: UV/style are exactly what he put in the home file. Wrong: length does not disable compact.","source":"Week 2, Day 5 — Skills & claude.md Setup"},{"id":"w2-18","topic":"Available vs loaded tools","question":"After adding a large MCP server such as Polygon/Massive, /context showed a long tool list but only a few tools in the window. What distinction is that?","options":["Available vs loaded: not every listed tool is billed into the prompt","Local vs remote: loaded tools are remote and available tools are local","Skills vs MCP: loaded means a skill wrapped the MCP automatically","Host vs server: available tools belong to Claude; loaded tools belong to you"],"correct":"Available vs loaded: not every listed tool is billed into the prompt","hint":"2026 Claude Code got better at not stuffing every tool description into the window.","explanation":"Correct: Polygon/Massive exposed many tools; only needed ones were loaded (example: a snapshot ticker at ~156 tokens). Available vs loaded is the efficiency feature so one fat server does not blow the window. Wrong: this is not the local/remote distinction. Wrong: it is not “a skill wrapped it.” Wrong: it is not host vs you. Context7 still added two tools (resolve library ID + query docs) you may need to say “use Context7” to trigger.","source":"Week 2, Day 3 — Adding MCP Servers: Context7 & Polygon IO"},{"id":"w2-19","topic":"Feature Dev skipped tests","question":"Feature Dev built a full Next.js app from a vague Jira ticket and opened a PR. What still went wrong until a human asked?","options":["A later stage was skipped — no automated tests, no manual tests, no reviewer agents","Clarifying questions mean the plugin is stuck and cannot scaffold an app","A merged PR guarantees every Feature Dev stage already ran, including tests","Sub-agents brief the parent in full, so skipped tests would have been obvious"],"correct":"A later stage was skipped — no automated tests, no manual tests, no reviewer agents","hint":"Farming work out of the parent window has a cost: the orchestrator understands less.","explanation":"Correct: Feature Dev stopped for clarifying questions (good), then built and PRed. Introspection: phase 6 skipped — no automated tests, no manual tests, no reviewer agents. Build passing ≠ validation. Sub-agents keep details out of parent context, so the orchestrator can miss that. Wrong: questions are the vague-ticket handling, not a stuck state. Wrong: a PR does not imply tests. Wrong: sub-agents do not automatically brief the parent in full.","source":"Week 2, Day 4 — Claude Code Builds a Full Next.js App from a Jira Ticket"},{"id":"w2-20","topic":"Cerebras skill and missed Jira text","question":"For the Cerebras-backed legal-doc chat, why reject streaming, and what Jira requirement was still missed at the end?","options":["Cerebras is fast enough that one structured call is cleaner; the legal disclaimer was still missing","Streaming is required for any chat UX; the disclaimer appeared automatically from Jira","Cerebras is a Claude model, so streaming is built in; signup was the missed requirement","Multiple LLM calls were required for extraction; Feature Dev cannot miss Jira text"],"correct":"Cerebras is fast enough that one structured call is cleaner; the legal disclaimer was still missing","hint":"A custom skill can steer the code — and a human still has to check acceptance criteria.","explanation":"Correct: three architecture agents proposed streaming; he wanted one structured LLM call (reply text + fields) because Cerebras is so fast streaming is unnecessary. The skill’s LiteLLM/OpenRouter/Cerebras extra_body showed up in the PR. PL-7 still missed the legal disclaimer from Jira despite review — human double-checks. Claude also added an unprompted try-before-signin (PLG) pattern. Wrong: streaming was not required. Wrong: Cerebras is an inference provider, not a Claude model. Wrong: Feature Dev + tests do not guarantee every Jira line lands.","source":"Week 2, Day 5 — Custom Cerebras skill, architecture, and final SaaS demo"}]},"week3":{"id":"week3","title":"Week 3 — Agentic Engineering","blurb":"Sub-agents, sandboxes, GSD vs Agent Teams vs Gastown, and the capstone.","questionCount":20,"questions":[{"id":"w3-01","topic":"Controlled chaos","question":"For “controlled chaos,” which order did the instructor recommend on a real project?","options":["Begin with control, loosen into chaos if results are good, tighten again if it rails off","Begin with a huge swarm, then add docs only after the first merge conflict","Treat orchestration as a chaos technique and skip sandboxes until production","Pick YOLO or spec-driven design forever; mixing them is how projects fail"],"correct":"Begin with control, loosen into chaos if results are good, tighten again if it rails off","hint":"Think control rods in a reactor — chaos techniques are useful, not the default start.","explanation":"Correct: chaos techniques include YOLO, Ralph, swarms that “let it all happen.” Control includes shared filesystem docs, negative-feedback review/test, destroyable sandboxes, and orchestration with hierarchy (firmly control). Aim for controlled chaos: start with control, loosen, tighten if needed. Wrong: starting with a huge swarm is the opposite order. Wrong: orchestration and sandboxes are control, not optional chaos. Wrong: you pick by risk and project type, not a lifetime allegiance.","source":"Week 3, Day 1 — Sub-Agents, Hooks, Swarms & Controlled Chaos"},{"id":"w3-02","topic":"Commands vs sub-agents","question":"A /doc-review slash command and a reviewer sub-agent can run the same prompt. What is the key difference?","options":["The slash command runs in the main thread and pollutes parent context; a sub-agent is a separate call","The sub-agent always appears as /reviewer; slash commands never show in /context","Slash commands isolate context like workers; sub-agents append every token to the parent","Skills are isolated workers by default; slash commands and sub-agents are identical"],"correct":"The slash command runs in the main thread and pollutes parent context; a sub-agent is a separate call","hint":"If /context grows after the review, you did not actually offload the work.","explanation":"Correct: a slash command is a shortcut prompt in the same conversation. A sub-agent is a separate LLM call; the main chat may not know the review transcript, though it can discover that plan.md gained a section. Wrong: custom agents do not appear as slash commands. Wrong: those isolation roles are reversed. Wrong: skills/commands run in the main thread unless you wrap them as agents.","source":"Week 3, Day 1 — Custom Slash Commands / Building Agents & Sub-Agents"},{"id":"w3-03","topic":"Slash commands and skills","question":"What are the two taught ways to add a custom slash command, and which is now the common default?","options":["A markdown file in .claude/commands/, or a skill that also appears as a slash command — skills are now the default","Only a plugin marketplace listing; command files and skills never show in /","A YAML-only registry plus $ARGUMENTS in settings.json; skills cannot appear as commands","Home-directory commands are project-scoped; repo commands apply to every project"],"correct":"A markdown file in .claude/commands/, or a skill that also appears as a slash command — skills are now the default","hint":"Saving the markdown file is the command — there is no extra registry step.","explanation":"Correct: (1) .claude/commands/ (project or home for all projects), typically lowercase-hyphen names, $ARGUMENTS replaced by text after the slash. (2) Skills automatically appear as slash commands (Cerebras → /cerebras-inference). Today people mostly use skills; command files still work and don’t need YAML front matter. Wrong: marketplaces are not the only path. Wrong: skills do appear as commands. Wrong: home vs project scope is the other way around.","source":"Week 3, Day 1 — Creating Custom Slash Commands"},{"id":"w3-04","topic":"Sub-agents vs agent teams","question":"What can an agent team do that a sub-agent generally cannot?","options":["Teammates stay long-lived, message each other, and you can talk to them without going through the lead","A teammate always returns a summary to a single caller and then disappears","Teams share one context window, which makes them cheaper than sub-agents","Sub-agents can DM each other on a shared task list; teams cannot"],"correct":"Teammates stay long-lived, message each other, and you can talk to them without going through the lead","hint":"Anthropic’s table: sub-agents report back efficiently; teams keep full independent windows.","explanation":"Correct: sub-agent = main Claude delegates one task, isolated context, result returns, generally not long-lived, you cannot message it independently. Agent teams = lead + teammates with long-running presence, they message each other (tester → frontend), human can address teammates directly. Teams are experimental and expensive (full independent windows, don’t return context to caller). Wrong: “return and disappear” is the sub-agent pattern. Wrong: teams are costlier, not cheaper. Wrong: DMs are the team feature.","source":"Week 3, Day 1 & Day 4 — Subagents vs Agent Teams"},{"id":"w3-05","topic":"Hooks","question":"For a Stop hook that should write planning/review.md via Codex, which hook action did he call most reliable?","options":["command — a shell action; prompt/agent hooks are fiddly and may not write files","prompt — instructions to Claude, because only Claude can touch the filesystem","agent — spawn a sub-agent, because prompt hooks are the ones that cannot run","matcher — matchers are an action type that always writes the review file"],"correct":"command — a shell action; prompt/agent hooks are fiddly and may not write files","hint":"Ralph loops are believed to be a Stop hook that re-prompts “you’re not finished.”","explanation":"Correct: hooks fire on events (PreToolUse, Stop, permission wait, before compact, …). Optional matcher filters when. Actions: command (shell), prompt (instructions), agent (spawn sub-agent). Prompt/agent are fiddly (permission limits; can’t write files). command is the most predictable. Demo: Stop → `codex exec` → planning/review.md. Don’t use hooks unless needed. Wrong: prompt/agent were the unreliable writers. Wrong: matcher is a filter, not an action that writes files.","source":"Week 3, Day 1 — Claude Code Hooks"},{"id":"w3-06","topic":"Approval fatigue and native sandbox","question":"Why can clicking approve on every tool call be less safe than it feels?","options":["Approval fatigue: you stop reading, so you are YOLO with a false sense of safety","Manual approval always disables the native sandbox, so clicks are required to stay safe","Sandboxes exist only for enterprise compliance and never change YOLO willingness","YOLO and sandboxing are opposites; you must pick exactly one forever"],"correct":"Approval fatigue: you stop reading, so you are YOLO with a false sense of safety","hint":"A ring-fence that auto-approves inside the box can be both more productive and more honest.","explanation":"Correct: unsandboxed 1/2/3 approvals produce fatigue — you stop reading. A sandbox ring-fences files/network and raises YOLO willingness for the right reason. Native /sandbox is OS-level, local, lighter than Docker; easy on Mac/Linux; Windows needed WSL at filming. Deny rules always win; web search may still ask. Wrong: clicks are not what enables the sandbox. Wrong: sandboxes are a control tool, not only compliance. Wrong: YOLO-in-a-sandbox is the intended pairing.","source":"Week 3, Day 2 — Sandboxing and Cloud Execution"},{"id":"w3-07","topic":"Ampersand remote","question":"What does prefixing a prompt with & do in a local Claude Code session?","options":["Sends the full conversation so far to Anthropic’s cloud sandbox as a remote task","Runs the prompt locally in the background without leaving your machine","Attaches uncommitted files to Claude on the web so GitHub is optional","Installs the GitHub app workflows without needing gh auth login"],"correct":"Sends the full conversation so far to Anthropic’s cloud sandbox as a remote task","hint":"Remote execution is delegating to another engine — typically GitHub-centric and already sandboxed.","explanation":"Correct: five remote entry points: (1) & in a local session (full conversation so far), (2) claude --remote, (3) claude.ai/code in a browser (trusted network is the usual pick; finishes via PR), (4) Claude mobile Code tab, (5) GitHub issue @Claude after the GitHub app — repo must be committed. Teleport attaches a remote session locally; /tasks lists remotes. Wrong: & is not local background. Wrong: on-the-web Claude clones committed git. Wrong: /install-github-app still needs gh.","source":"Week 3, Day 2 — Remote Execution & Five Ways to Run Claude Code"},{"id":"w3-08","topic":"Sprites.dev","question":"Why is skip-permissions treated as acceptable on a Sprites.dev sandbox?","options":["The sprite is an isolated remote machine, so YOLO will not smash your laptop","Sprites only run Claude, and Anthropic auto-reverts any destructive command","sprite create provisions a slow VM, so dangerous commands cannot finish","GitHub auth in the sprite uses a browser on the remote box, which blocks YOLO"],"correct":"The sprite is an isolated remote machine, so YOLO will not smash your laptop","hint":"Third-party sandboxes are agent-agnostic — Claude, Codex, OpenCode, and so on.","explanation":"Correct: Sprites.dev (Fly.io) = stateful, checkpoint/restore, hardware-isolated Linux. Auto dangerously-skip-permissions is “okay” because of isolation — unlike YOLO on your laptop. Agent-agnostic; claude is preinstalled (quit/relaunch if it is an old build); /resume after gh auth (browser still opens on your laptop). Wrong: not Claude-only, no auto-revert magic. Wrong: create was ~0.6s, not a slow VM. Wrong: the auth browser is local.","source":"Week 3, Day 2 — Third-Party Cloud Sandboxes on Sprites.dev"},{"id":"w3-09","topic":"Large-repo context","question":"On a large inherited codebase, why is @plan.md in CLAUDE.md a different strategy than linking planning/market-data.md?","options":["@ inserts the entire file every session; a path/link lets the agent read it only when needed","A markdown link always dumps the file; @ is a cheap pointer that never costs tokens","Large-repo docs should live in one giant root CLAUDE.md so nothing is missed","Generated subdirectory docs should be accepted without a human eyeball"],"correct":"@ inserts the entire file every session; a path/link lets the agent read it only when needed","hint":"Progressive disclosure for packages: enough interface to call the right functions, not every file.","explanation":"Correct: @file inserts the entire file. For large repos, describe + path so the agent chooses to read (like skills). Invest in progressive CLAUDE.md/AGENTS.md per directory. Keep docs updated; you eyeball Claude’s drafts. Wrong: @ is expensive, not cheap. Wrong: one giant root file burns context. Wrong: generated docs still need human review. Also: bite-sized work; never “refactor the whole 50-person repo.”","source":"Week 3, Day 3 — Best Practices for Large Team Codebases"},{"id":"w3-10","topic":"Claude Agent SDK","question":"What is the Claude Agent SDK for, as taught?","options":["Programmatically driving Claude Code (skills, plugins, tools) from your own code","Anthropic’s generic agent framework, competing with LangGraph-style libraries","The TUI inside the Claude Code terminal, formerly named Claude Agents SDK","A way to skip dotenv override so API keys from the shell cannot be replaced"],"correct":"Programmatically driving Claude Code (skills, plugins, tools) from your own code","hint":"The name is singular “Agent,” and it is not “build any agent.”","explanation":"Correct: formerly Claude Code SDK; drives the Claude Code ecosystem from code (query loop, allowed_tools, etc.). Use case: an app on that ecosystem, or skipping the terminal. Don’t burn Opus in a tight loop. Wrong: it is not a generic agent framework (that contrast was also made vs OpenAI Agents SDK in Week 2). Wrong: you don’t use it as the TUI; the package name is not plural. Wrong: the demo used load_dotenv(override=True) as a warning to actually override.","source":"Week 3, Day 3 — Driving Claude Code Programmatically with Claude Agent SDK"},{"id":"w3-11","topic":"Cowork vs OpenClaw","question":"How do Claude Cowork and OpenClaw differ in the course’s framing?","options":["Cowork is Anthropic’s desktop agent for non-coding work; OpenClaw is a local chat-app sidekick with serious security risk","OpenClaw is Anthropic’s official coding orchestrator; Cowork is only a GitHub Action","Both run only in Anthropic’s cloud and are the course’s core swarm tools","Cowork is a new coding IDE; OpenClaw is safe-by-default because it cannot see your files"],"correct":"Cowork is Anthropic’s desktop agent for non-coding work; OpenClaw is a local chat-app sidekick with serious security risk","hint":"One is a research-preview tab next to Chat and Code; the other is a hyped personal agent on your machine.","explanation":"Correct: Cowork takes the Claude Code experience to everyday/business tasks (desktop tabs: Chat, Code = on-the-web, Cowork). Demo: receipts folder → Excel. OpenClaw (Claudebot/Maltbot lineage) is a personal sidekick via Telegram/WhatsApp, often with access to everything on your computer — security people worry; sandbox it; not course core; if you can’t use a terminal you’re not ready. Wrong: OpenClaw is not official Anthropic orchestration. Wrong: neither is the core swarm tool. Wrong: Cowork isn’t a coding IDE; OpenClaw is risky because it can see local files.","source":"Week 3, Day 3 — Claude Cowork and OpenClaw"},{"id":"w3-12","topic":"When to use teams","question":"Per the Anthropic table as taught, when should you pick agent teams over sub-agents?","options":["When workers must share findings, challenge each other, and coordinate on their own","When you need a cheap, focused worker that returns a summary to the caller","Whenever you are on Windows, because sub-agents require tmux","Whenever you want maximum inter-agent chat, because more chatter always helps"],"correct":"When workers must share findings, challenge each other, and coordinate on their own","hint":"Teams use full independent context windows and do not return that context to the caller.","explanation":"Correct: use sub-agents for quick focused workers that report back (relatively efficient). Use teams when they must share findings, challenge each other, coordinate on their own. Cost warning: teams are expensive. Enable with experimental flag; in-process teammateMode works on Mac and PC (Shift+Up/Down); tmux is Mac/Linux. Wrong: cheap report-back is the sub-agent case. Wrong: Windows uses in-process, not “sub-agents need tmux.” Wrong: too much chatter makes them grind.","source":"Week 3, Day 4 — Claude Code Agent Teams"},{"id":"w3-13","topic":"Delegate mode","question":"What problem does Shift+Tab delegate mode prevent on an agent team?","options":["The lead doing the work itself instead of waiting for teammates to complete","Teammates messaging each other without going through the human","The experimental teams flag turning off after the first prompt","Git becoming unavailable until the team is cleaned up"],"correct":"The lead doing the work itself instead of waiting for teammates to complete","hint":"A common failure is the lead jumping in; docs also say to prompt “wait for teammates.”","explanation":"Correct: Shift+Tab → delegate mode so the lead doesn’t do the work. Also prompt “wait for teammates to complete.” Shift+Up/Down switch teammates; Ctrl+T toggles the task list; “clean up the team” to shut down. He skipped feature-dev/code-simplifier on the team because they spawn sub-agents and you lose control. Wrong: teammate DMs are a desired feature. Wrong: delegate mode is not the experimental flag. Wrong: git stays available.","source":"Week 3, Day 4 — Setting Up Claude Code Agent Teams"},{"id":"w3-14","topic":"GSD","question":"What failure mode was GSD designed to fight, and how did it compare with Agent Teams in the live run?","options":["Context rot; it used sub-agents and cost on the order of 10× the time and tokens of teams","Merge conflicts; it used Agent Teams and finished in about 15 minutes","Approval fatigue; it is Claude-only and avoided markdown state on purpose","Sandbox escapes; it skipped permissions by default and reused the Cerebras skill faithfully"],"correct":"Context rot; it used sub-agents and cost on the order of 10× the time and tokens of teams","hint":"GSD is spec-driven design plus radical orchestration — more rails than teams.","explanation":"Correct: GSD (“get s*** done”) fights context rot as context fills. SDD + orchestration + meta-prompting; works on Claude Code, OpenCode, Gemini CLI; uses sub-agents, not Agent Teams; state in markdown; plan/execute/verify. His run ~5 hours vs teams ~30 min, ~10× tokens; serial, overstoried, thrashed on tests; slight edge to Agent Teams for experience. Wrong: it does not use Agent Teams and was not the fast one. Wrong: not Claude-only; it leans on files. Wrong: he still approved commands; GSD also rewrote inference instead of using the Cerebras skill as written.","source":"Week 3, Day 4 — GSD vs Claude Agent Teams"},{"id":"w3-15","topic":"Gastown glossary","question":"In Gastown, who merges parallel workers’ MRs and who do you actually talk to?","options":["The refinery merges MRs; the mayor is the Claude you talk to as coordinator","The witness merges MRs; polecats are the only Claudes you are allowed to prompt","Beads merge MRs; the deacon is required even when you have a single project","The convoy merges MRs; a rig is a worker agent nicknamed a polecat"],"correct":"The refinery merges MRs; the mayor is the Claude you talk to as coordinator","hint":"Gastown is Yegge’s extreme stage-8 orchestrator — optional, bewildering, built for concurrency.","explanation":"Correct: mayor = the Claude you talk to. Polecat = worker. Refinery = merges MRs / merge conflicts (expected with many parallel writers). Witness = monitors polecats, notifies the mayor. Beads ≈ git-like issues/ledger. Convoy = bundle of tasks slung to polecats. Rig = project; crew = workspace inside a rig. Deacon watches multiple projects. Wrong: witness monitors, doesn’t merge. Wrong: deacon is for multi-project; beads are tickets. Wrong: convoy is a task bundle; rig is a project.","source":"Week 3, Day 5 — Gastown Orchestrating Swarms"},{"id":"w3-16","topic":"Orchestrator lineup","question":"Order GSD, Claude Agent Teams, and Gastown from most disciplined to most chaotic, as taught.","options":["GSD, then Agent Teams (his favorite to work with), then Gastown","Gastown, then GSD, then Agent Teams as the slowest rails option","Agent Teams, then Gastown, then GSD as the most concurrent option","GSD, then Gastown, then Agent Teams, which he ranked as the daily chaos default"],"correct":"GSD, then Agent Teams (his favorite to work with), then Gastown","hint":"Two of the three can wrap multiple coding agents; one is a Claude Code feature.","explanation":"Correct: most disciplined → most crazy: GSD (SDD family, markdown state, slow/reliable, human-in-the-loop) → Claude Agent Teams (faster, ~30 min, experimental, his favorite experience — power without feeling totally out of control) → Gastown (massive concurrency, fastest throughput, hyped/bewildering). GSD and Gastown can target multiple coding agents; Agent Teams is a Claude Code feature. Wrong: Gastown is not the most disciplined. Wrong: GSD is not the most concurrent. Wrong: Teams was not ranked as the chaos default.","source":"Week 3, Day 5 — Gastown vs Claude Agent Teams vs GSD"},{"id":"w3-17","topic":"Codex vs Claude on the capstone","question":"On the trader-workstation capstone, what was the instructor’s split verdict on Codex vs Claude Code?","options":["Claude Code remains his favorite platform; on this bake-off Codex led on speed and live-data quality","He switched his daily CLI to Codex and dropped Claude Code after the Fly.io deploy","Agent Teams won the live P&L bake-off; Codex could not fix the hardcoded market-data key","Codex automatically reads claude.md, so no file rename was needed in the sprite"],"correct":"Claude Code remains his favorite platform; on this bake-off Codex led on speed and live-data quality","hint":"Codex wanted agents.md, used --yolo, enabled experimental sub-agents, and finished in about 15 minutes.","explanation":"Correct: Codex in a sprite with --yolo and experimental sub-agents built the app ~15 minutes (fastest). UI looked different and, to him, best; only Codex kept the portfolio updating; Codex found Claude’s wrong hardcoded Massive key and explained after-hours quiet tape. Claude Code remains his favorite tooling; on this capstone Codex led. Deploy to Fly.io in a short Codex talk. Wrong: he did not switch daily drivers. Wrong: Teams/GSD looked static on P&L; Codex did fix the key. Wrong: he renamed to agents.md because Codex does not read claude.md.","source":"Week 3, Day 5 — Codex Wins and Course Wrap-Up"},{"id":"w3-18","topic":"Plugin layout","question":"What extra files can a Claude Code plugin include besides commands, skills, agents, and hooks?","options":["mcp.json for MCP servers and lsp.json so Claude can validate an uncommon language","Only marketplace.json inside the plugin folder; MCP cannot ship inside a plugin","A required agents.md at the plugin root; plugin.json is optional metadata","tmux.conf, because plugins are how you enable experimental agent teams"],"correct":"mcp.json for MCP servers and lsp.json so Claude can validate an uncommon language","hint":"A plugin is a folder with claude-plugin/plugin.json; a marketplace.json is how you distribute many plugins.","explanation":"Correct: required claude-plugin/plugin.json (name, description, version) plus folders commands/skills/agents/hooks. Later also mcp.json and lsp.json (LSP because of Karpathy’s tweet; common languages already known). Marketplace: .claude-plugin/marketplace.json, add via /plugin (GitHub or local ./), install, restart. Wrong: MCP can ship in a plugin; marketplace.json is the catalog, not the only extra file. Wrong: plugin.json is required. Wrong: teams are a settings flag, not a plugin tmux file.","source":"Week 3, Day 1 — Building Custom Claude Code Plugins and Marketplaces"},{"id":"w3-19","topic":"Windows native sandbox","question":"At filming, what extra requirement did native /sandbox have on Windows?","options":["WSL — or skip native sandbox and use Anthropic cloud or a third-party sprite instead","Docker Desktop only; WSL was explicitly not involved in the sandbox story","A paid Max plan; Pro cannot turn on /sandbox on any operating system","tmux teammateMode, because sandboxing is implemented as an agent team"],"correct":"WSL — or skip native sandbox and use Anthropic cloud or a third-party sprite instead","hint":"Native sandbox is local OS-level, not Anthropic’s servers.","explanation":"Correct: /sandbox is built into Claude Code, local, OS-level, lighter than Docker, easy on Mac and Linux. Windows required WSL at filming (native Windows “coming soon”). Don’t take on WSL just for this — use Claude on the web or Sprites. Wrong: Docker/dev containers were the older technique he skipped as already a given. Wrong: sandbox is not a Max-only flag. Wrong: tmux is a teams mode, not sandbox.","source":"Week 3, Day 2 — Setting Up Claude Code Sandbox"},{"id":"w3-20","topic":"Agentic engineer and leverage order","question":"What title does the course say you earn at the end of the finale week, and what order of leverage should you use when extending an agent setup?","options":["Agentic engineer — official plugins first, then skills, then MCP if needed","Vibe coder — MCP servers first, then plugins, then a home claude.md dump","Orchestrator operator — Gastown first, then OpenClaw, then native /sandbox","Prompt engineer — auto-compact first, then emoji READMEs, then YOLO on the laptop"],"correct":"Agentic engineer — official plugins first, then skills, then MCP if needed","hint":"The identity arc is vibe coder → vibe engineer → this title — and you still own the code.","explanation":"Correct: Week 1 vibe coding, Week 2 vibe engineering, Week 3 unlocks agentic engineer. Mandate: build. Leverage order: official plugins (feature-dev, simplifier, frontend-design) → skills → MCP if needed (Context7). Extra topics Karpathy’s tweet omitted: sandboxing
