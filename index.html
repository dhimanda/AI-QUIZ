+YOLO, Ralph, GSD. Proactive context: don’t wait to auto-compact; dump to markdown then /clear. Git is a rewind button. Own quality (Jellyfin, no slop/emojis). Wrong: you are past “just vibe coder,” and MCP-first is backwards. Wrong: Gastown/OpenClaw are optional/teaser, not the leverage order. Wrong: auto-compact-wait and emoji READMEs are anti-patterns.","source":"Week 3, Day 5 — Course Recap: From Vibe Coding to Agentic Engineer"}]},"combined":{"id":"combined","title":"Combined — All Weeks","blurb":"Thirty mixed questions across the full three-week arc.","questionCount":30,"questions":[{"id":"c-01","topic":"Course identity arc","question":"The course names three successive professional identities. Which sequence is correct?","options":["Vibe coding, then vibe engineering, then agentic engineer","Prompt engineering, then context engineering, then vibe coding","Agentic engineer, then vibe engineering, then YOLO coding","Vibe engineering, then missing-manual studies, then prompt engineering"],"correct":"Vibe coding, then vibe engineering, then agentic engineer","hint":"Each week’s subtitle is an identity, not just a tool list.","explanation":"Correct: Week 1 is vibe coding for fun and profit (IDEs, first YOLO, commercial MVP). Week 2 is vibe engineering (Willison) — CLI professionals who stay accountable. Week 3 unlocks agentic engineer (sub-agents, sandboxes, orchestrators). Wrong: prompt→context is a Day 2 skill shift, not the three-week identity arc. Wrong: you do not start as an agentic engineer. Wrong: vibe engineering is Week 2, not Week 1.","source":"Week 1 roadmap, Week 2 Pro Week intro, Week 3 recap"},{"id":"c-02","topic":"Memory filenames","question":"You need persistent instructions in Cursor, Claude Code, and Antigravity. Which filenames match the course?","options":["agents.md, claude.md, and gemini.md / .agent rules respectively","claude.md in all three, because the industry fully standardized in 2025","agents.md for Claude Code, claude.md for Cursor, and AGENTS.md for Antigravity","Only Cursor rules files; markdown memory files were taught as deprecated"],"correct":"agents.md, claude.md, and gemini.md / .agent rules respectively","hint":"Same job, different product conventions — a nested file still overrides for its subtree.","explanation":"Correct: agents.md for Cursor, Codex, GitHub Copilot; claude.md for Claude Code; gemini.md / .agent/Rules for Antigravity. Trend is convergence on agents.md as de facto standard, but Claude Code still wants claude.md (a one-line @AGENTS.md trick can share). Wrong: not one filename everywhere. Wrong: those names are swapped. Wrong: markdown memory files were not deprecated.","source":"Week 1 Days 2–3; Week 2 Day 1"},{"id":"c-03","topic":"Four tricks","question":"Which four “software tricks” around next-token prediction did the course say take you from 2022 ChatGPT to coding agents?","options":["Illusion of memory, reasoning/thinking, tools, and loops","Fine-tuning, RAG, vector databases, and mixture-of-experts routing","System prompts, temperature, top-p sampling, and stop sequences","YOLO mode, Ralph loops, MCP, and Gastown polecats"],"correct":"Illusion of memory, reasoning/thinking, tools, and loops","hint":"Tools-in-a-loop is the trick that most clearly turns a token predictor into an agent.","explanation":"Correct: apparent intelligence is largely four tricks in software around the model: illusion of memory, reasoning/thinking tokens, tools, and loops. Wrong: fine-tuning/RAG/MoE were not that four-item list. Wrong: decoding knobs are not the agent recipe. Wrong: YOLO/Ralph/MCP/Gastown are later workflow/product layers built on top of those tricks.","source":"Week 1, Day 2 — How LLMs Work / Tools and Loops"},{"id":"c-04","topic":"Reasoning tokens","question":"A two-coin puzzle is used to show “think step by step.” Without reasoning the model says 1/2. What is the taught answer with reasoning, and why?","options":["2/3, because you were not told which of the two coins is the one showing heads","1/2, because a fair coin is still 50/50 no matter how the problem is worded","1/4, because two coins have four faces and only one face is tails","1, because “one is heads” means the other must be tails in the example"],"correct":"2/3, because you were not told which of the two coins is the one showing heads","hint":"Reasoning tokens are not a calculator; they change which probability the model actually computes.","explanation":"Correct: toss two coins, one is heads; chance the other is tails? Without reasoning → 1/2. With thinking tokens → 2/3, because you were not told which coin is heads. Models were trained to emit thinking tokens before the answer; generating them improves accuracy. Wrong: 1/2 is the unreasoning trap. Wrong: 1/4 and 1 are not the taught answers.","source":"Week 1, Day 2 — How LLMs Work: Tokens, Memory, and Reasoning"},{"id":"c-05","topic":"Claude Code as CLI","question":"Claude Code is primarily which kind of surface, and what did that surface change about usefulness?","options":["A CLI that can iterate, test, and modify until a goal — a step-change vs IDE chat","A VS Code fork whose sidebar is the professional surface for vibe engineering","A plugin on real VS Code, positioned the same way as GitHub Copilot","A cloud-only IDE; the terminal mode is a dumbed-down training-wheels view"],"correct":"A CLI that can iterate, test, and modify until a goal — a step-change vs IDE chat","hint":"There is a VS Code extension, but the course treats the retro terminal as the real product.","explanation":"Correct: Claude Code invented/popularized the productive retro-terminal CLI; it can iterate/test/modify until a goal, which dramatically increased usefulness vs Week 1 IDE chats. The sidebar exists but is more constrained/packaged for novices. Wrong: it is not primarily a VS Code fork (that is Cursor/Antigravity). Wrong: Copilot is the plugin example. Wrong: the terminal is the full-featured surface, not training wheels.","source":"Week 1 Day 1 surfaces; Week 2 Day 1 CLI vs sidebar"},{"id":"c-06","topic":"When not to YOLO","question":"When is YOLO with a coding agent actually discouraged?","options":["With fast-frontier/small models, and on unsandboxed machines for dangerous commands","Only with Opus 4.5, GPT 5.2 Codex, or Gemini 3 Pro on a throwaway sprite","Whenever you have a concise agents.md, because specs make YOLO unnecessary","On Sprites.dev, because third-party isolation makes skip-permissions forbidden"],"correct":"With fast-frontier/small models, and on unsandboxed machines for dangerous commands","hint":"Two different lectures, same theme: model quality and blast radius both have to qualify.","explanation":"Correct: Week 1 — YOLO only with top-tier (Opus 4.5, GPT 5.2 Codex, Gemini 3 Pro); fast-frontier (Composer, Haiku) needs baby steps. Week 2/3 — real YOLO (`--dangerously-skip-permissions` / Codex `--yolo`) belongs in a sandbox (native, Anthropic cloud, Sprites). Wrong: those named models are when YOLO is more defensible. Wrong: agents.md does not make YOLO “off.” Wrong: Sprites is where skip-permissions is treated as OK.","source":"Week 1 Day 4 model choice; Week 2 YOLO; Week 3 sandboxes"},{"id":"c-07","topic":"Jellyfin / owning the code","question":"Jellyfin’s LLM contribution policy, as taught, includes which golden rule?","options":["Do not YOLO a vague prompt onto the repo and commit the result as-is; you own the code","LLM-generated code is banned entirely, including using a model as a private aid","You must commit claude.md/agents.md so reviewers can see the prompt that produced the diff","Translations in issues are banned, but dumping agent READMEs into PRs is encouraged"],"correct":"Do not YOLO a vague prompt onto the repo and commit the result as-is; you own the code","hint":"Generation is cheap; senior review of slop is expensive — quality beats “was it LLM-shaped.”","explanation":"Correct: LLMs OK as aid, not a flood of slop. LLM output banned in issues/PRs/comments except translations. Don’t commit LLM meta files (claude.md/agents.md). You must explain the change without LLM text. Golden rule: do not YOLO a vague vibe prompt onto the repo and commit as-is. Mantra: the code comes from us; we own it. Wrong: private aid is allowed. Wrong: meta files are banned from the PR, not required. Wrong: translations are the exception that is allowed; README spam is the problem.","source":"Week 1, Day 4 — Responsible YOLO; echoed in Week 3 wrap"},{"id":"c-08","topic":"Watch like a hawk","question":"Karpathy described his workflow flipping to roughly 80% agents / 20% edits. What did he push back against in that same arc?","options":["Agent-swarm / “no IDE” hype — if you care about the code, watch them like a hawk","Using agents at all, because he still claims a clean, measurable 10× velocity","Skill atrophy concerns, which he said are overblown if you YOLO enough","Slop, which he treated as only a visual-design problem of purple landing pages"],"correct":"Agent-swarm / “no IDE” hype — if you care about the code, watch them like a hawk","hint":"Net faster, mainly because they do more work — not a clean 10×, and slop/atrophy are real.","explanation":"Correct: late Jan flip ~80% agents / 20% edits. Agent-swarm / no-IDE hype is too much; models make mistakes; if you care about the code, watch like a hawk. Speedup is net faster / expansion, not clean 10×. Fun vs typing; atrophy of reading code; “slop apocalypse.” Wrong: he does not claim clean 10×. Wrong: he is worried about atrophy. Wrong: slop includes emoji-README spam, not only purple UIs.","source":"Week 1, Day 5 — Karpathy on Vibe Coding & Commercial MVP"},{"id":"c-09","topic":"Front end vs back end","question":"Where do secrets belong in the web-apps picture, and which early projects were front-end only?","options":["On the server in .env; the FPS game and the first Kanban board were front-end only","In the browser so the agent can always see them; the first Kanban already had a Python API","Committed to git so every session loads them; the FPS and the OpenRouter site were front-end only","In OpenRouter’s dashboard only; Python cannot back a JavaScript UI in this course"],"correct":"On the server in .env; the FPS game and the first Kanban board were front-end only","hint":"Front end = HTML/CSS/JS in the browser; back end = server, database, LLM calls, secrets.","explanation":"Correct: secrets and LLM calls belong on the back end in .env (gitignored). Day 1 FPS and Day 3 Kanban were front-end only; Day 4’s site had a JS back end calling OpenRouter; Day 5 added a Python FastAPI back end. Python is the most common back end for LLM/AI coding in the course. Wrong: keys in the browser are the anti-pattern. Wrong: Day 3 was not Python. Wrong: do not commit .env; Python was the Day 5 back end.","source":"Week 1, Day 5 — Web Apps 101"},{"id":"c-10","topic":"UV vs pip","question":"Agents often prefer pip and requirements.txt. What did the instructor mandate instead, and where?","options":["UV (`uv run`, `uv add`) — in agents.md / home claude.md, because you must insist","Conda only, because UV cannot run inside Docker containers in this course","pip, because that is what models prefer and fighting them wastes context","npm for Python, so the same lockfile can serve Next.js and FastAPI"],"correct":"UV (`uv run`, `uv add`) — in agents.md / home claude.md, because you must insist","hint":"If you do not write the positive instruction, the agent will drift back to pip.","explanation":"Correct: agents prefer pip/requirements.txt; you must insist on UV. That rule showed up in Week 1 full-stack agents.md and again as a global home claude.md pet peeve in Week 2. Wrong: conda was not the mandate. Wrong: “let them use pip” is the drift to prevent. Wrong: npm is the JS side, not the Python packager.","source":"Week 1 Day 5 FastAPI setup; Week 2 Day 5 home claude.md"},{"id":"c-11","topic":"OpenCode vs Claude Code","question":"OpenCode vs Claude Code: what trade-off did the instructor state?","options":["OpenCode wins on model flexibility; Claude Code is preferred because the platform is organized around Claude","GLM 4.7 in OpenCode matched Opus 4.5 on the independent refactor, so Claude Code is obsolete","OpenCode cannot connect paid Claude or GPT; Claude Code is the only multi-model CLI","OpenCode’s Plan mode writes files immediately; Claude Code cannot plan at all"],"correct":"OpenCode wins on model flexibility; Claude Code is preferred because the platform is organized around Claude","hint":"Free/OSS reviews can look impressive and still be far from frontier on a full fix-and-refactor.","explanation":"Correct: OpenCode is the easy OSS/multi-model path (GLM 4.7, Kimi, OpenCode Zen, OpenRouter). Top OSS still far from frontier for independently implementing a full refactor vs Opus 4.5. He still prefers Claude Code’s platform fit; OpenCode wins flexibility / multi-model sessions. Wrong: GLM did not match Opus on the refactor. Wrong: OpenCode can connect many providers. Wrong: OpenCode Plan mode forces think-before-act and does not write until Build.","source":"Week 2, Day 1 — OpenCode as a Claude Code alternative"},{"id":"c-12","topic":"AMP Free","question":"How is AMP Free actually “free,” and what do you not pick?","options":["About $10/day of frontier-model credit for watching ads; AMP picks the model for you","You pay $10/day; Ctrl+S then lets you choose Opus vs GPT the way /model does","It only runs local Ollama models; Rush mode is the high-quality thinking setting","It is Anthropic’s free Claude Code tier, limited to the ChatGPT-style web chat"],"correct":"About $10/day of frontier-model credit for watching ads; AMP picks the model for you","hint":"Ctrl+S cycles Smart → Deep → Rush — quality/speed modes, not a vendor picker.","explanation":"Correct: AMP Free ≈ $10/day of frontier credit for watching ads (not $10 you pay). You don’t pick the model. Ctrl+S cycles Smart / Deep / Rush. Demo ~272k context. Claude Code still had the edge; AMP is an easy free/frontier-ish option. Wrong: you don’t pay $10 or pick Opus vs GPT. Wrong: Rush is the faster mode; AMP is not Ollama-only. Wrong: AMP is not Anthropic’s free chat tier.","source":"Week 2, Day 1 — AMP Code, OpenCode & Claude Code with OpenRouter"},{"id":"c-13","topic":"Local model hardware","question":"What hardware floor did the course give for a worthwhile local coding model via Ollama?","options":["On the order of 64 GB GPU RAM, or 64 GB unified RAM on Mac; a 20B model is not enough","Any modern laptop with 8 GB RAM, because GPT-OSS 20B was the recommended daily driver","Local models match Opus quality at 16 GB if you use LM Studio instead of Ollama","Claude Code on localhost:11434 still bills Anthropic, so hardware does not matter"],"correct":"On the order of 64 GB GPU RAM, or 64 GB unified RAM on Mac; a 20B model is not enough","hint":"The practical cheap path taught was OpenCode Zen or OpenRouter, not a thin laptop GPU.","explanation":"Correct: ≥64 GB GPU RAM, or ≥64 GB unified RAM on Mac. GPT-OSS 20B is not enough; need about OSS 120B, which almost nobody can run. Practical free/cheap: OpenCode Zen or OpenRouter (or rent a cloud GPU). Wrong: 8 GB / 20B was explicitly not enough. Wrong: 16 GB was not taught as Opus-equal. Wrong: pointing Claude Code at Ollama is actually local — hardware still matters.","source":"Week 2, Day 1 — OpenCode, Ollama, and local models"},{"id":"c-14","topic":"MCP host/client/server","question":"In MCP terms, what is Claude Code, and what do you usually mean by “adding an MCP”?","options":["Claude Code is the host; you add a server (someone else’s tool bundle)","Claude Code is the MCP server; you write a new host for each tool","Claude Code is the client process you install from mcp.so, not the app","Host and server are the same process; “adding an MCP” means fine-tuning Claude"],"correct":"Claude Code is the host; you add a server (someone else’s tool bundle)","hint":"People saying “I’m using this MCP” almost always mean a particular MCP server.","explanation":"Correct: Host = overall AI app (Claude Code, ChatGPT, an Agents SDK app). Client = code inside the host, one per set of tools, baked in. Server = someone else’s tool bundle. You give the host a server description; it sets up a client and runs the server. Wrong: Claude Code is not the server. Wrong: you don’t install Claude as a client from a marketplace. Wrong: adding MCP is not fine-tuning.","source":"Week 2, Day 3 — MCP Servers Explained: Hosts, Clients, and Discovery"},{"id":"c-15","topic":"Context7","question":"What failure mode does Context7 exist to prevent?","options":["Models hallucinating outdated APIs because of a training cutoff","Compaction deleting claude.md in the middle of a Feature Dev run","OAuth tokens expiring on the Atlassian remote MCP server","Sprites.dev serving an old Claude Code build until you relaunch"],"correct":"Models hallucinating outdated APIs because of a training cutoff","hint":"One terminal command, then the model can pull version-specific docs — if you actually trigger the tools.","explanation":"Correct: Context7 (Upstash) lets the model pull up-to-date, version-specific docs. Two tools: resolve library ID and query docs. Triggering can be hit-and-miss — say “use Context7.” Vet the real publisher; clones exist. A Context7 plugin wraps the same MCP for easier discovery. Wrong: those other failures are real in the course but are not what Context7 is for.","source":"Week 2, Day 3 — Context7 MCP"},{"id":"c-16","topic":"Atlassian reauth","question":"Atlassian MCP tools hang with no useful error. What is the taught first fix?","options":["Assume auth was lost: open /mcp and reauthenticate, then retry the Jira call","Assume the issue key is wrong and rewrite the ticket ID in claude.md","Assume the model is still thinking and wait for compact to finish the hang","Assume GitHub PAT scopes are the cause and rotate the OpenRouter key"],"correct":"Assume auth was lost: open /mcp and reauthenticate, then retry the Jira call","hint":"Auth often gets lost; hanging Atlassian tools were a running operational theme.","explanation":"Correct: remote Atlassian MCP uses OAuth 2. Auth often gets lost; symptom: tools hang. /mcp → reauthenticate. Do this before big Feature Dev runs. Wrong: a bad key is possible but not the demonstrated hang. Wrong: hangs are not “thinking” or compact. Wrong: GitHub PAT and OpenRouter keys are different credentials.","source":"Week 2, Days 4–5 — Jira MCP workflow"},{"id":"c-17","topic":"Invoking custom agents","question":"A custom reviewer agent is defined in .claude/agents/reviewer.md. How do you invoke it?","options":["Ask Claude to use the reviewer sub-agent — it does not appear as a slash command","Type /reviewer, because every agent file is automatically a slash command","Agents only live in .claude/commands/; without that folder they cannot run","You must always set model to Haiku or the file is ignored"],"correct":"Ask Claude to use the reviewer sub-agent — it does not appear as a slash command","hint":"If you omit tools and model in the markdown, the agent inherits the parent’s.","explanation":"Correct: custom agents do not appear as slash commands. Prompt “use the reviewer sub agent”; Claude decides. Work stays out of main context. Locations: project .claude/agents/, user ~/.claude, or plugins. If tools/model omitted, inherit parent. Wrong: /reviewer is how commands/skills work, not agents. Wrong: commands/ is the other folder. Wrong: Haiku is optional (explore often uses it).","source":"Week 3, Day 1 — Building Agents & Sub-Agents"},{"id":"c-18","topic":"Naive multi-agent","question":"Naive “three Claudes in three terminals” on a thin plan.md is likely to fail. Why?","options":["The pieces will not fit and the agents will not even know the others exist","Terminal isolation automatically coordinates via git, so the risk is only cost","That pattern is what “agent teams” means, so a lead will assign interfaces","Empty backend/frontend/tests folders are enough of a contract for parallelism"],"correct":"The pieces will not fit and the agents will not even know the others exist","hint":"Shared planning docs — not extra terminals — are the stabilizing force.","explanation":"Correct: pressing + and telling three Claudes to build frontend/backend/tests without a fleshed-out plan is a fiasco: interfaces won’t match; they won’t know the others exist. FiNALLY used planning/ plus @plan.md in CLAUDE.md so agents leave information for each other. Agent teams are a different, experimental product with a lead, messaging, and a task list — not merely extra terminals. Wrong: git isolation is not coordination. Wrong: empty folders are not the contract.","source":"Week 3, Day 1 — FiNALLY setup and naive multi-Claude"},{"id":"c-19","topic":"Context hygiene","question":"What should you do instead of waiting for auto-compact when context is almost full and another ticket remains?","options":["Write keep-forever facts into claude.md / plan.md, then /clear and start the next task","Let auto-compact fire in the middle of the rewrite so nothing important is dropped","Run /compact and /clear together, then skip updating markdown because the summary is lossless","Install more MCP servers so the buffer fills with tools instead of conversation"],"correct":"Write keep-forever facts into claude.md / plan.md, then /clear and start the next task","hint":"2026 compacting is better than 2025, but the operational habit is still: you choose the boundary.","explanation":"Correct: fear compacting mid-task (incoherence, dropped facts, repeated mistakes). Instructor habit: update claude.md with implemented status, then /clear rather than compacting a full window. 2026 advice was to trust compacting more than in 2025, but students were still taught to manage boundaries. Wrong: auto-compact mid-rewrite is the failure mode. Wrong: summaries are not lossless. Wrong: more MCP accelerates compact.","source":"Week 1 context engineering; Week 2 Days 4–5 ops; Week 3 wrap"},{"id":"c-20","topic":"Large-repo workflow row","question":"On a 50-person production codebase, which row of the course chart should you reach for?","options":["2025 / yellow: markdown, incremental slices, spec-driven / GSD, trust but verify","2026 / purple: YOLO on the laptop, Ralph overnight, and a full-repo simplify swarm","Stage 8 only: Gastown polecats as the default enterprise process","Skip tests and coverage entirely, because review is cheaper than generation"],"correct":"2025 / yellow: markdown, incremental slices, spec-driven / GSD, trust but verify","hint":"Greenfield MVPs can take the 2026 row; inherited large repos generally cannot.","explanation":"Correct: mission-critical / large / out-of-training-distribution → 2025 techniques (docs, incremental, SDD/GSD, trust but verify). MVP / boilerplate / risk appetite → 2026 (YOLO in a sandbox, Ralph, swarms). Large-repo day: progressive docs, plugins then skills, bite-sized chunks, reject coverage theater and over-mocking, human review of slop. Wrong: purple craziness on a 50-person repo was explicitly discouraged (including Ralph-looping a whole-repo simplify). Wrong: Gastown is optional extreme, not the enterprise default. Wrong: generation is cheap and review is hard — you need tests and humans more, not less.","source":"Week 1 workflows; Week 3 large codebases and wrap chart"},{"id":"c-21","topic":"Plugins vs agent teams","question":"Why skip Feature Dev and Code Simplifier while running Claude Agent Teams on FiNALLY?","options":["Those plugins spawn sub-agents, and you lose control of the team’s work","They are Claude-only, and Agent Teams can only use OpenCode plugins","Frontend-design and Playwright cannot be installed in the same repo as teams","Skip-permissions is required for teams, and those plugins disable YOLO"],"correct":"Those plugins spawn sub-agents, and you lose control of the team’s work","hint":"He still installed frontend-design, Context7, and Playwright — the issue was nested workers.","explanation":"Correct: avoid feature-dev / code-simplifier on a team because they spawn sub-agents and you lose control. He also skipped a dedicated reviewer to reduce chatter. Result was more serial than expected (probably better); ~30 minutes, zero-shot runnable app; he did not skip permissions because chaos + YOLO is extra risky. Wrong: Agent Teams is Claude Code; those plugins are Claude plugins. Wrong: he did install frontend-design and Playwright. Wrong: skip-permissions was not required here.","source":"Week 3, Day 4 — Agent Teams for the trading app"},{"id":"c-22","topic":"10x vs 2–3x","question":"What did the 10× feeling become after the first hard blocker in the multi-agent workstation, and which debug loop should be internalized?","options":["About 2–3× faster than writing it yourself; reproduce → markdown issue → fix → prove","A guaranteed 10× end-to-end; skip the repro because agents never need a written bug","Slower than handwriting; abandon git and rely on rewind for the rest of the project","Exactly 10× if you read every diff; the four-step loop is only for Copilot in VS Code"],"correct":"About 2–3× faster than writing it yourself; reproduce → markdown issue → fix → prove","hint":"Expect the first fix to fail. Stay the boss even if you are not reading every line.","explanation":"Correct: tmux quad of Codex/Claude felt 10×, then a blocker where agents looped; still 2–3× vs writing it himself. Internalize: reproduce → understand in a markdown issue → fix → test/prove; expect the first fix to fail. Same spirit as Week 1’s repro → root cause → fix → demonstrate, and Week 2’s debug.md. Wrong: 10× is not guaranteed. Wrong: git remains the rewind button. Wrong: the loop is course-wide, and reading every diff is not required to get 2–3×.","source":"Week 3 Day 5 wrap; Week 1–2 debugging mantras"},{"id":"c-23","topic":"Beyond Karpathy’s list","question":"Which extra topics did the instructor say Karpathy’s “missing manual” tweet did not name?","options":["Sandboxing plus YOLO, Ralph loops, and GSD","Agents, sub-agents, MCP, skills, hooks, and slash commands","Plugins, tools, permissions, context, and IDE integrations","Prompts, memory, modes, workflows, and LSPs"],"correct":"Sandboxing plus YOLO, Ralph loops, and GSD","hint":"The tweet is the vocabulary list; a few later techniques still sit outside it.","explanation":"Correct: re-read Karpathy’s list (agents, sub-agents, prompts, context, memory, modes, permissions, tools, plugins, skills, hooks, MCP, LSPs, slash commands, workflows, IDEs) plus things he didn’t name: sandboxing + YOLO, Ralph loops, GSD. Wrong: those other items are on Karpathy’s list as taught.","source":"Week 1 missing-manual lecture; Week 3 best-practices wrap"},{"id":"c-24","topic":"codex exec","question":"What does `codex exec \"...\"` do that opening a Codex IDE panel does not?","options":["Runs a prompt as a shell-level peer agent, for example writing planning/review.md","It is a Claude Code slash command that can only run inside the TUI","It requires Codex; a second Claude is not allowed to play the reviewer role","It shares the full parent transcript with Codex so isolation is impossible"],"correct":"Runs a prompt as a shell-level peer agent, for example writing planning/review.md","hint":"Tell the wrapper agent “do not review yourself” so it actually shells out.","explanation":"Correct: Codex CLI (`codex`) is OpenAI’s Claude Code equivalent. `codex exec` runs a prompt as a shell-level agent — used to review plan.md → review.md, and later as a Stop-hook reviewer of changes since last commit. A second Claude could also be the reviewer; different LLMs are “fun, not required.” Wrong: it is not a Claude slash command. Wrong: Claude can review too. Wrong: the point is isolation (even if Claude sometimes cheats and reads the file itself).","source":"Week 3, Day 1 — Codex CLI reviews and hooks"},{"id":"c-25","topic":"GitHub @Claude","question":"GitHub @Claude on an issue will clone the repo in Anthropic’s cloud. What must be true first?","options":["Everything it needs is committed and pushed; uncommitted files are not visible there","Uncommitted working-tree files are uploaded automatically with the issue comment","You only connected GitHub in the browser; workflow YAMLs are optional","Native /sandbox on Windows without WSL is enough to replace the GitHub app"],"correct":"Everything it needs is committed and pushed; uncommitted files are not visible there","hint":"The setup PR adds .github/workflows/claude.yml and claude-code-review.yml after gh auth login.","explanation":"Correct: @Claude in a GitHub issue uses the Claude GitHub app, clones the repo, so everything must be committed. Setup: connect GitHub, /install-github-app, needs gh auth login, merge the PR that adds the two workflow YAMLs. Wrong: uncommitted files stay local. Wrong: browser connect alone is not enough. Wrong: native sandbox is a different, local approach.","source":"Week 3, Day 2 — GitHub integration and five remote paths"},{"id":"c-26","topic":"Test quality","question":"What testing behavior did the course say LLMs do “to a fault,” and what should a good test survive?","options":["Over-mocking to hit coverage paths; tests should survive a reimplementation but fail when logic breaks","Refusing to write mocks; 80% coverage is the goal agents should optimize","Deleting integration tests; mocks are the best proof of production behavior","Writing fewer tests than humans; more tests are always better regardless of quality"],"correct":"Over-mocking to hit coverage paths; tests should survive a reimplementation but fail when logic breaks","hint":"Put the testing strategy in AGENTS.md/claude.md and push back on test slop the way you would in a human review.","explanation":"Correct: don’t obsess on 80% coverage (Week 1 already showed letter-of-the-law grinding). LLMs over-mock. Want tests that survive reimplementation but fail when logic breaks. Wrong: 80% is not the goal. Wrong: mocks do not prove production; Week 1 also preferred live OpenRouter tests over mocks for the AI integration. Wrong: more tests are not always better.","source":"Week 1 Day 5 coverage trap; Week 3 Day 3 large-repo tests"},{"id":"c-27","topic":"Productivity multipliers","question":"A senior engineer says agents are “always 10×.” What did the course actually claim about multipliers?","options":["Big wins on greenfield UI; incremental or even negative on large, novel, or legacy work","A clean 10× on every task with Opus, including novel MCP servers outside training data","Negative on Next.js CRUDs, and 10× only on out-of-distribution backend protocols","Multipliers ignore task shape and only change when YOLO or Ralph mode is enabled"],"correct":"Big wins on greenfield UI; incremental or even negative on large, novel, or legacy work","hint":"Always net positive with top agents was the vibe — how much still depends on the job.","explanation":"Correct: 10× sometimes (Kanban/React greenfield: days → minutes). Incremental on large/legacy/complex backend. Can subtract value on work outside training data (streamable HTTP MCP server — faster to write himself). Estimation trap: code rattles out, then you hit a wall for hours. Capstone: 10× feeling became 2–3× after the first blocker. Wrong: not 10× on novel MCP. Wrong: greenfield UI is where the big wins were. Wrong: YOLO is not the multiplier switch.","source":"Week 1 Days 2 & 4; Week 2 estimation; Week 3 capstone"},{"id":"c-28","topic":"Fresh context after debug","question":"After a long failing debug chat, why start a new session that only re-reads agents.md and plan.md?","options":["An empty-ish window with those files is efficient context; the old debug trace is clutter","New chats cannot see markdown files, so the agent is forced to invent a cleaner architecture","You should keep one chat for the whole project so the model “remembers” every stack trace","plan.md is ignored unless the previous transcript is still in the window"],"correct":"An empty-ish window with those files is efficient context; the old debug trace is clutter","hint":"Write the design decision into plan.md first — the new chat will not remember it otherwise.","explanation":"Correct: after ~30 minutes of drag-and-drop looping, the human confirmed the UI already worked while tests still failed. Practice: update plan.md with design decisions, new chat, re-read plan.md/agents.md so the window isn’t full of the old debug. Same idea as Week 2 /clear between Jira tickets. Wrong: new chats can read files. Wrong: one mega-chat is how you burn the window. Wrong: plan.md is for the new session to load.","source":"Week 1 Day 5 Codex drag-and-drop; Week 2 ticket hygiene"},{"id":"c-29","topic":"Cloud network preset","question":"Which remote network preset did he recommend for Claude Code’s cloud environment, and how does a successful browser run usually finish?","options":["Trusted network; the work typically lands as a GitHub pull request","None (air-gapped); the work is copied back only via teleport into your working tree","Full network always; mobile Code tab cannot see the same sessions as the browser","Trusted means no network; @Claude issues therefore cannot open PRs"],"correct":"Trusted network; the work typically lands as a GitHub pull request","hint":"Research-preview remote can be slow and flaky — still the path that made phone-driven coding possible.","explanation":"Correct: claude.ai/code first-time cloud environment network: none / trusted / full; trusted is the usual pick. Completes via GitHub PR. Mobile Code tab shares the same sessions. Wrong: none is the air-gap option, not the usual pick, and teleport is how you attach a remote session, not the default finish. Wrong: full is not “always,” and mobile does share sessions. Wrong: trusted is not “no network.”","source":"Week 3, Day 2 — Claude Code on the web, mobile, and GitHub"},{"id":"c-30","topic":"Accountability","question":"Who is accountable for agent-produced code in this course, and what instinct did Willison say you still need?","options":["You are; including an instinct for what to outsource to AI and what to keep","The model vendor is; once tests pass, human proof is optional","The team lead agent is; orchestration transfers accountability off the human","Open source maintainers are; Jellyfin will catch slop so you do not have to"],"correct":"You are; including an instinct for what to outsource to AI and what to keep","hint":"Frontend was treated as safer to delegate than backend code that actually calls LLMs.","explanation":"Correct: repeated from Week 1 through Week 3: you are the boss; it is your work product. Willison’s practices include tests, planning, docs, git, review (including LLM self-review), managing a collaborator who will cheat if allowed, QA, research, and instinct for what to outsource. Instructor: frontend he can fully delegate; LLM-calling backend often struggles (Week 1 main.py mess). Wrong: vendors, lead agents, and maintainers do not take your accountability. Jellyfin’s policy is extra social pressure, not a safety net that replaces you.","source":"Week 1–3 accountability thread; Week 2 Willison practices"}]}}}</script>
  <script>
    const KEYS = ["1", "2", "3", "4"];
    const STORAGE_KEY = "ai-coder-exam-v1";
    const state = {
      data: null,
      view: "home",
      sectionId: null,
      questions: [],
      index: 0,
      selected: null,
      revealed: false,
      hintOn: false,
      answers: [],
      reviewFilter: "all",
    };

    const $main = document.getElementById("main");
    const $homeBtn = document.getElementById("homeBtn");

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function prepareQuestions(raw) {
      return raw.map((q) => ({
        ...q,
        shuffled: shuffle(q.options),
      }));
    }

    function currentSection() {
      return state.data.sections[state.sectionId];
    }

    function score() {
      return state.answers.filter((a) => a && a.correct).length;
    }

    function save() {
      if (state.view !== "exam") {
        sessionStorage.removeItem(STORAGE_KEY);
        return;
      }
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
        sectionId: state.sectionId,
        index: state.index,
        selected: state.selected,
        revealed: state.revealed,
        hintOn: state.hintOn,
        answers: state.answers,
        questions: state.questions,
      }));
    }

    function restore() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const saved = JSON.parse(raw);
        if (!saved.sectionId || !state.data.sections[saved.sectionId]) return false;
        Object.assign(state, saved, { view: "exam", reviewFilter: "all" });
        return true;
      } catch {
        return false;
      }
    }

    function chooseExam(sectionId) {
      state.sectionId = sectionId;
      state.view = "ready";
      sessionStorage.removeItem(STORAGE_KEY);
      render();
    }

    function startExam(sectionId) {
      const section = state.data.sections[sectionId];
      state.sectionId = sectionId;
      state.questions = prepareQuestions(section.questions);
      state.index = 0;
      state.selected = null;
      state.revealed = false;
      state.hintOn = false;
      state.answers = new Array(section.questions.length).fill(null);
      state.view = "exam";
      save();
      render();
    }

    function goHome() {
      if (state.view === "exam" && state.answers.some(Boolean) && state.index < state.questions.length) {
        const ok = confirm("Leave this exam? Your current attempt will be cleared.");
        if (!ok) return;
      }
      state.view = "home";
      state.sectionId = null;
      sessionStorage.removeItem(STORAGE_KEY);
      render();
    }

    function letter(i) {
      return String.fromCharCode(65 + i);
    }

    function renderHome() {
      const s = state.data.sections;
      const cards = [
        ["week1", "20 questions", "~15 min"],
        ["week2", "20 questions", "~15 min"],
        ["week3", "20 questions", "~15 min"],
        ["combined", "30 questions", "~25 min"],
      ].map(([id, count, time]) => {
        const sec = s[id];
        return `
          <button class="card exam-card" type="button" data-start="${id}">
            <div class="kicker">${escapeHtml(id === "combined" ? "All weeks" : "Weekly exam")}</div>
            <h2>${escapeHtml(sec.title)}</h2>
            <p>${escapeHtml(sec.blurb)}</p>
            <div class="meta">
              <span class="pill">${count}</span>
              <span>${time}</span>
            </div>
          </button>`;
      }).join("");

      $main.innerHTML = `
        <h1>Choose an exam</h1>
        <p class="lede">${escapeHtml(state.data.subtitle)} Four options on every question. Hints are free. After you submit, you will see why each option is right or wrong.</p>
        <div class="grid">${cards}</div>
        <section class="card howto">
          <h3>How it works</h3>
          <ul>
            <li>One question at a time. Select an answer, then press <span class="kbd">Submit</span> — nothing is scored until then.</li>
            <li>Use keys <span class="kbd">1</span>–<span class="kbd">4</span> to choose, <span class="kbd">H</span> for a hint, <span class="kbd">Enter</span> to submit or continue.</li>
            <li>Option order is shuffled each attempt. Question wording never names the lecture it came from; the source appears after you answer.</li>
            <li>At the end you get a full review, so this doubles as a study sheet.</li>
          </ul>
        </section>`;

      $main.querySelectorAll("[data-start]").forEach((btn) => {
        btn.addEventListener("click", () => chooseExam(btn.dataset.start));
      });
    }

    function renderReady() {
      const sec = currentSection();
      const n = sec.questions.length;
      const mins = n === 30 ? 25 : 15;
      $main.innerHTML = `
        <section class="card q-card">
          <div class="kicker pill" style="display:inline-block;margin-bottom:12px">Ready when you are</div>
          <h1>${escapeHtml(sec.title)}</h1>
          <p class="lede">${escapeHtml(sec.blurb)}</p>
          <div class="meta" style="margin-bottom:22px">
            <span class="pill">${n} questions</span>
            <span>About ${mins} minutes</span>
            <span>Multiple choice · free hints</span>
          </div>
          <div class="actions">
            <button class="primary" id="startBtn" type="button">Start Exam</button>
            <button class="secondary" id="backBtn" type="button">Back to exams</button>
          </div>
        </section>`;
      document.getElementById("startBtn").addEventListener("click", () => startExam(state.sectionId));
      document.getElementById("backBtn").addEventListener("click", goHome);
    }

    function renderExam() {
      const q = state.questions[state.index];
      const n = state.questions.length;
      const pct = Math.round((state.index / n) * 100);
      const answered = state.answers.filter(Boolean).length;
      const options = q.shuffled.map((opt, i) => {
        let cls = "opt";
        if (!state.revealed && state.selected === opt) cls += " selected";
        if (state.revealed) {
          if (opt === q.correct) cls += " correct";
          else if (opt === state.selected && opt !== q.correct) cls += " wrong";
          else cls += " dim";
        }
        return `
          <button class="${cls}" type="button" data-i="${i}" ${state.revealed ? "disabled" : ""}>
            <span class="key">${letter(i)}</span>
            <span>${escapeHtml(opt)}</span>
          </button>`;
      }).join("");

      let extra = "";
      if (state.hintOn) {
        extra += `<div class="hint"><strong>Hint.</strong> ${escapeHtml(q.hint)}</div>`;
      }
      if (state.revealed) {
        const ok = state.selected === q.correct;
        extra += `
          <div class="feedback ${ok ? "ok" : "no"}" role="status">
            <h3>${ok ? "Correct" : "Not quite"}</h3>
            ${ok ? "" : `<p>You chose: ${escapeHtml(state.selected || "—")}<br>Correct answer: ${escapeHtml(q.correct)}</p>`}
            <p>${escapeHtml(q.explanation)}</p>
            <div class="source">Source: ${escapeHtml(q.source)}${q.topic ? " · " + escapeHtml(q.topic) : ""}</div>
          </div>`;
      }

      $main.innerHTML = `
        <div class="progress-wrap">
          <div class="progress-top">
            <span>${escapeHtml(currentSection().title)}</span>
            <span>Question ${state.index + 1} of ${n}${answered ? ` · Score ${score()}/${answered}` : ""}</span>
          </div>
          <div class="bar" aria-hidden="true"><span style="width:${state.revealed ? Math.round(((state.index + 1) / n) * 100) : pct}%"></span></div>
        </div>
        <section class="card q-card">
          <p class="q-text">${escapeHtml(q.question)}</p>
          <div class="options" role="group" aria-label="Answer choices">${options}</div>
          ${extra}
          <div class="actions">
            <button class="secondary" id="hintBtn" type="button" ${state.hintOn ? "disabled" : ""}>Hint</button>
            ${state.revealed
              ? `<button class="primary" id="nextBtn" type="button">${state.index + 1 === n ? "See results" : "Next question"}</button>`
              : `<button class="primary" id="submitBtn" type="button" ${state.selected ? "" : "disabled"}>Submit answer</button>`}
            <span class="meta">Keys <span class="kbd">1</span>–<span class="kbd">4</span> · <span class="kbd">H</span> hint · <span class="kbd">Enter</span></span>
          </div>
        </section>`;

      $main.querySelectorAll(".opt").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (state.revealed) return;
          state.selected = q.shuffled[Number(btn.dataset.i)];
          save();
          render();
        });
      });
      document.getElementById("hintBtn")?.addEventListener("click", showHint);
      document.getElementById("submitBtn")?.addEventListener("click", submitAnswer);
      document.getElementById("nextBtn")?.addEventListener("click", nextQuestion);
    }

    function showHint() {
      state.hintOn = true;
      save();
      render();
    }

    function submitAnswer() {
      if (!state.selected || state.revealed) return;
      const q = state.questions[state.index];
      state.revealed = true;
      state.answers[state.index] = {
        id: q.id,
        question: q.question,
        selected: state.selected,
        correctAnswer: q.correct,
        correct: state.selected === q.correct,
        explanation: q.explanation,
        source: q.source,
        topic: q.topic,
        hint: q.hint,
      };
      save();
      render();
      document.querySelector(".feedback")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function nextQuestion() {
      if (state.index + 1 >= state.questions.length) {
        state.view = "results";
        sessionStorage.removeItem(STORAGE_KEY);
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      state.index += 1;
      state.selected = null;
      state.revealed = false;
      state.hintOn = false;
      save();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function band(pct) {
      if (pct >= 90) return "Excellent — you could teach this back.";
      if (pct >= 75) return "Strong pass. Review the misses and you will be solid.";
      if (pct >= 60) return "Getting there. The review list below is the fastest way to close gaps.";
      return "Treat the review as a study sheet and try this exam again.";
    }

    function renderResults() {
      const n = state.questions.length;
      const s = score();
      const pct = Math.round((s / n) * 100);
      const items = state.answers.filter((a) => {
        if (state.reviewFilter === "missed") return a && !a.correct;
        if (state.reviewFilter === "correct") return a && a.correct;
        return a;
      });
      const reviews = items.map((a, i) => `
        <article class="card">
          <span class="tag ${a.correct ? "ok" : "no"}">${a.correct ? "Correct" : "Missed"}</span>
          <div class="q">${escapeHtml(a.question)}</div>
          <p>Your answer: ${escapeHtml(a.selected)}</p>
          ${a.correct ? "" : `<p>Correct answer: ${escapeHtml(a.correctAnswer)}</p>`}
          <p>${escapeHtml(a.explanation)}</p>
          <div class="source">Source: ${escapeHtml(a.source)}${a.topic ? " · " + escapeHtml(a.topic) : ""}</div>
        </article>`).join("") || `<p class="lede">Nothing in this filter.</p>`;

      $main.innerHTML = `
        <section class="card scorebox">
          <div class="kicker pill">${escapeHtml(currentSection().title)}</div>
          <div class="big">${pct}%</div>
          <p>${s} of ${n} correct</p>
          <p class="lede">${band(pct)}</p>
          <div class="actions" style="justify-content:center">
            <button class="primary" id="retryBtn" type="button">Retry this exam</button>
            <button class="secondary" id="againHome" type="button">Choose another exam</button>
          </div>
        </section>
        <h2 style="margin:28px 0 8px;letter-spacing:-0.03em">Review</h2>
        <div class="filters">
          <button class="secondary" type="button" data-filter="all" aria-pressed="${state.reviewFilter === "all"}">All</button>
          <button class="secondary" type="button" data-filter="missed" aria-pressed="${state.reviewFilter === "missed"}">Missed only</button>
          <button class="secondary" type="button" data-filter="correct" aria-pressed="${state.reviewFilter === "correct"}">Correct only</button>
        </div>
        <div class="review">${reviews}</div>`;

      document.getElementById("retryBtn").addEventListener("click", () => startExam(state.sectionId));
      document.getElementById("againHome").addEventListener("click", () => {
        state.view = "home";
        render();
      });
      $main.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.reviewFilter = btn.dataset.filter;
          render();
        });
      });
    }

    function render() {
      $homeBtn.classList.toggle("hidden", state.view === "home");
      if (state.view === "home") renderHome();
      else if (state.view === "ready") renderReady();
      else if (state.view === "exam") renderExam();
      else renderResults();
    }

    document.addEventListener("keydown", (e) => {
      if (e.target && ["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
      if (state.view === "ready" && e.key === "Enter") {
        e.preventDefault();
        startExam(state.sectionId);
        return;
      }
      if (state.view !== "exam") return;
      if (KEYS.includes(e.key) && !state.revealed) {
        const q = state.questions[state.index];
        const opt = q.shuffled[Number(e.key) - 1];
        if (opt) {
          state.selected = opt;
          save();
          render();
        }
      } else if ((e.key === "h" || e.key === "H") && !state.hintOn) {
        showHint();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (state.revealed) nextQuestion();
        else submitAnswer();
      }
    });

    $homeBtn.addEventListener("click", goHome);

    window.addEventListener("beforeunload", (e) => {
      if (state.view === "exam" && state.answers.some(Boolean)) {
        e.preventDefault();
        e.returnValue = "";
      }
    });

    async function loadData() {
      try {
        const res = await fetch("quiz-data.json", { cache: "no-store" });
        if (res.ok) return await res.json();
      } catch (_) { /* file:// or offline: use fallback */ }
      const raw = document.getElementById("quiz-fallback").textContent.trim();
      if (raw && raw !== "{}") return JSON.parse(raw);
      throw new Error("Could not load quiz-data.json. If you opened this as a file, deploy the folder or serve it locally.");
    }

    loadData()
      .then((data) => {
        state.data = data;
        if (!restore()) state.view = "home";
        render();
      })
      .catch((err) => {
        $main.innerHTML = `<div class="error"><strong>Could not start the exam.</strong><p>${escapeHtml(err.message)}</p></div>`;
      });
  </script>
</body>
</html>
